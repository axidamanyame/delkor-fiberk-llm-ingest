<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfer — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { fmt } from './js/supabaseClient.js';
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { getActiveLocation, formLocOptions, SCOPE_EVENT } from './js/scope.js';
  import { confirmAction, toast } from './js/confirm-action.js';
  import { OPERATING_SUBSIDIARIES } from './js/supabaseClient.js';
  import {
    accNav, esc, loadAccounts, loadTransfers, scopeAccounts, saveRow, KEYS, accountOpts,
    currentSubCode, nextRef, ensureDemoBooks,
  } from './js/accounting.js';

  const session = await mountUltimateShell();
  if (!session) location.replace('/login.html');
  const app = document.getElementById('app');
  const q = new URLSearchParams(location.search);
  const editId = q.get('id');
  const viewOnly = q.get('view') === '1';
  const who = session?.user?.email || session?.profile?.full_name || 'Admin';
  let existing = null;
  let accounts = [];

  async function boot() {
    await ensureDemoBooks();
    accounts = scopeAccounts(await loadAccounts());
    if (editId) existing = (await loadTransfers()).find((r) => String(r.id) === String(editId)) || null;
    paint();
  }

  function paint() {
    const ro = viewOnly ? 'disabled' : '';
    const title = viewOnly ? 'View transfer' : (editId ? 'Edit transfer' : 'Add transfer');
    app.innerHTML = `
      ${accNav('xfer')}
      <h1>${esc(title)}</h1>
      <form id="xf-form" class="st-card">
        <div class="st-grid4">
          <label class="fld">Date:*
            <input id="xdt" type="date" ${ro} value="${esc((existing?.transfer_date || new Date().toISOString()).slice(0, 10))}" />
          </label>
          <label class="fld">Reference No:
            <input id="xref" ${ro} value="${esc(existing?.ref_no || '')}" placeholder="Auto if empty" />
          </label>
          <label class="fld">From Account:*
            <select id="xfrom" ${ro}>${accountOpts(accounts, existing?.from_account_id)}</select>
          </label>
          <label class="fld">To Account:*
            <select id="xto" ${ro}>${accountOpts(accounts, existing?.to_account_id)}</select>
          </label>
          <label class="fld">Amount:*
            <input id="xamt" type="number" step="0.01" min="0" ${ro} value="${esc(existing?.amount ?? '')}" />
          </label>
          <label class="fld">Subsidiary:*
            <select id="xsub" ${ro}>
              ${OPERATING_SUBSIDIARIES.map((s) => `<option value="${esc(s.code)}" ${(existing?.subsidiary_code || currentSubCode()) === s.code ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
            </select>
          </label>
          <label class="fld">Business Location:
            <select id="xloc" ${ro}>${formLocOptions(existing?.location_code || getActiveLocation() || '', { includeVirtual: true, placeholder: 'Please Select' })}</select>
          </label>
        </div>
        <label class="fld">Additional notes:
          <textarea id="xnote" rows="2" ${ro}>${esc(existing?.note || '')}</textarea>
        </label>
        <div class="st-save">
          ${viewOnly
            ? `<a class="ult-add" href="/accounting-transfer-form.html?id=${esc(editId)}">Edit</a>
               <a class="ult-btn ult-btn-outline" href="/accounting-transfer.html">Back</a>`
            : `<button type="submit">${editId ? 'Update' : 'Save'}</button>
               <a class="ult-btn ult-btn-outline" href="/accounting-transfer.html" style="margin-left:8px">Cancel</a>`}
        </div>
      </form>`;

    document.getElementById('xf-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fromId = document.getElementById('xfrom').value;
      const toId = document.getElementById('xto').value;
      const amount = Number(document.getElementById('xamt').value || 0);
      if (!fromId || !toId || fromId === toId || amount <= 0) {
        toast('Choose two different accounts and an amount', 'error');
        return;
      }
      const from = accounts.find((a) => String(a.id) === fromId);
      const to = accounts.find((a) => String(a.id) === toId);
      const ok = await confirmAction(editId ? 'Update transfer?' : 'Save transfer?', `${from?.name} → ${to?.name} ${fmt(amount)}`);
      if (!ok) return;
      const all = await loadTransfers();
      await saveRow('accounting_transfers', KEYS.transfers, {
        ...(existing || {}),
        id: existing?.id,
        transfer_date: document.getElementById('xdt').value,
        ref_no: document.getElementById('xref').value.trim() || nextRef('transfer', all),
        from_account_id: fromId,
        to_account_id: toId,
        from_account: from?.name || '',
        to_account: to?.name || '',
        amount,
        note: document.getElementById('xnote').value,
        added_by: existing?.added_by || who,
        subsidiary_code: document.getElementById('xsub').value || currentSubCode(),
        location_code: document.getElementById('xloc').value,
      });
      toast(editId ? 'Transfer updated' : 'Transfer saved');
      location.assign('/accounting-transfer.html');
    });
  }
  window.addEventListener(SCOPE_EVENT, () => { if (!editId) boot(); });
  boot();
</script>
</body>
</html>
