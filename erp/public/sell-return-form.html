<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sell Return</title>
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .page h1{margin:0 0 14px;font-size:22px;color:var(--ult-text)}
    .card{background:var(--ult-card);border:1px solid var(--ult-border);border-radius:12px;padding:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
    .fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
    .fld input,.fld select,.fld textarea{font-weight:400;padding:8px 10px;border:1px solid var(--ult-border);border-radius:6px}
    #err{color:#b91c1c}
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { supabase, fmt } from './js/supabaseClient.js';
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { stampScope, subsidiarySelect, locationSelect } from './js/entity-scope.js';
  import { confirmAction } from './js/confirm-action.js';
  import { filterBySidebar } from './js/scope.js';
  await mountUltimateShell();
  const saleId = new URLSearchParams(location.search).get('sale');
  const app = document.getElementById('app');
  const { data: sales } = await supabase.from('sales_orders').select('id,reference,so_number,customer_name,total_amount,amount_paid,subsidiary_code,location_code').order('created_at', { ascending: false }).limit(400);
  const rows = filterBySidebar(sales || []);
  const picked = rows.find((s) => String(s.id) === String(saleId)) || rows[0];
  app.innerHTML = `
    <h1>Add Sell Return</h1>
    <form id="f" class="card">
      <div class="grid">
        ${subsidiarySelect(picked?.subsidiary_code||'')}
        ${locationSelect(picked?.subsidiary_code||'', picked?.location_code||'')}
        <label class="fld">Original sale*
          <select name="sales_order_id" required>
            ${rows.map((s)=>`<option value="${s.id}" ${picked&&s.id===picked.id?'selected':''}>${s.reference||s.so_number||s.id} · ${s.customer_name||''} · ${fmt(s.total_amount)}</option>`).join('')}
          </select>
        </label>
        <label class="fld">Return amount*<input name="total_amount" type="number" step="0.01" required value="${picked?Number(picked.total_amount||0):0}" /></label>
        <label class="fld" style="grid-column:1/-1">Reason<textarea name="notes" placeholder="Wrong size, damaged, customer change of mind"></textarea></label>
      </div>
      <p style="margin-top:16px">
        <button class="ult-btn ult-btn-primary" type="submit">Save</button>
        <a class="ult-btn ult-btn-outline" href="/sell-returns.html">Cancel</a>
      </p>
      <p id="err"></p>
    </form>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    if (!(await confirmAction('Save this sell return?', 'Stock and the customer balance will be credited.'))) return;
    const fd = new FormData(e.target);
    const body = {
      sales_order_id: fd.get('sales_order_id'),
      reference: 'SR-' + Date.now().toString().slice(-6),
      total_amount: Number(fd.get('total_amount')||0),
      notes: fd.get('notes') || null,
      status: 'completed',
    };
    try { stampScope(body, e.target); } catch (ex) { document.getElementById('err').textContent = ex.message; return; }
    delete body.agent_id;
    let q = await supabase.from('sell_returns').insert(body);
    if (q.error) q = await supabase.from('sales_returns').insert(body);
    if (q.error) { document.getElementById('err').textContent = q.error.message; return; }
    location.assign('/sell-returns.html');
  };
</script>
</body>
</html>
