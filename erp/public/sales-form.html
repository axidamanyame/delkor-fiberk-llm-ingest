<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Add Sale</title>
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .page{color:var(--ult-text)}
    .sell-card{background:var(--ult-card);border:1px solid var(--ult-border);border-radius:12px;padding:16px 20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .sell-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
    @media(max-width:900px){.sell-grid{grid-template-columns:1fr}}
    .fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ult-text)}
    .fld input,.fld select,.fld textarea{font-weight:400;padding:8px 10px;border:1px solid var(--ult-border);border-radius:6px;width:100%;box-sizing:border-box;color:var(--ult-text);background:var(--ult-card)}
    .dest-table{min-width:960px}
    .dest-table input{width:100%;min-width:0;padding:4px 6px;border:1px solid var(--ult-border);border-radius:4px}
    #hits{margin-top:8px}
    .po-view{background:var(--ult-card);color:var(--ult-text);padding:8px 8px 88px;font-size:13px}
    .po-view-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--ult-border);padding:8px 4px 14px;margin-bottom:16px}
    .po-view-head h1{margin:0;font-size:20px;font-weight:600}
    .po-x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ult-text)}
    .po-meta{display:grid;grid-template-columns:1.2fr 1.4fr 1fr auto;gap:16px;margin-bottom:18px;line-height:1.45}
    .po-k{font-weight:400;margin-bottom:2px}
    .po-date-top{text-align:right;font-weight:600;white-space:nowrap}
    .po-table-wrap{overflow-x:auto;margin-bottom:22px}
    table.po-lines{width:100%;border-collapse:collapse;min-width:900px;font-size:13px}
    .sell-view table.po-lines th{background:#16a34a;color:#fff;font-weight:700;padding:8px;text-align:left;border:1px solid #15803d}
    table.po-lines td{padding:8px;border:1px solid var(--ult-border);vertical-align:middle}
    table.po-lines tbody tr:nth-child(even){background:var(--ult-card-2)}
    table.po-lines td.num{text-align:right;white-space:nowrap}
    .po-lower{display:grid;grid-template-columns:1.4fr .9fr;gap:28px}
    .po-lower h3{margin:0 0 8px;font-size:15px;font-weight:700}
    table.po-pay,table.po-act{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}
    table.po-pay th{background:#14b8a6;color:#fff;padding:8px;text-align:left;border:1px solid #0d9488}
    table.po-pay td,table.po-act td,table.po-act th{padding:8px;border:1px solid var(--ult-border)}
    table.po-pay td.empty{text-align:center;color:#6b7280}
    table.po-act th{text-align:left;background:var(--ult-card-2);font-weight:700}
    .po-bar{background:#e5e7eb;min-height:28px;border-radius:2px;margin-top:6px;padding:6px 8px}
    .po-notes{margin:12px 0}
    .po-tot{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9}
    .po-grand{font-weight:800;margin-top:4px}
    .po-actions{position:fixed;right:24px;bottom:24px;display:flex;gap:10px;z-index:20}
    .po-print,.po-close{background:#4f46e5;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
    .po-close{background:#6366f1}
    @media(max-width:900px){.po-meta,.po-lower{grid-template-columns:1fr}.po-date-top{text-align:left}}
    @media print{.po-actions,.po-x,.ult-top,.ult-side,#grok-app-branding{display:none !important}.po-view{padding:0}}
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { mountSellDoc } from './js/doc-forms.js';
  await mountUltimateShell();
  await mountSellDoc('sale');
</script>
</body>
</html>
