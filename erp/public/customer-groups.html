<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Customer Groups — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .page{color:var(--ult-text)}.page h1{margin:0 0 14px;font-size:22px;color:var(--ult-text)}
    .card{background:var(--ult-card);border:1px solid var(--ult-border);border-radius:12px;padding:16px;width:100%;box-sizing:border-box}
    .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .head h2{margin:0;font-size:16px;color:var(--ult-text)}
    .add{background:#4f46e5;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
    .bar .grow{flex:1}
    .bar select,.bar input,.bar button{border:1px solid #111;background:var(--ult-card);color:var(--ult-text);border-radius:999px;padding:5px 10px;font-size:12px}
    table.ult-table th,table.ult-table td{color:var(--ult-text)}
    .btn-edit{color:#6d28d9;border:1px solid #c4b5fd;background:var(--ult-card);border-radius:999px;padding:4px 10px;font-size:12px;text-decoration:none}
    .btn-del{color:#e11d48;border:1px solid #fda4af;background:var(--ult-card);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
    .pager{display:flex;justify-content:flex-end;gap:6px}
    .pager button{border:1px solid #111;background:var(--ult-card);color:var(--ult-text);padding:4px 10px}
    .pager button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
    .col-vis-menu,.pdf-orient{position:absolute;top:28px;background:#fff;border:1px solid #111;border-radius:8px;padding:8px;z-index:40}
    .pdf-orient button{display:block;width:100%;margin:4px 0;border:1px solid #111;background:#fff;padding:6px}
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
</head>
<body>
  <main class="ult-main page" id="app">Loading…</main>
  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { mountUltimateShell } from './js/ultimate-shell.js';
  import { confirmAction, ackResult } from './js/confirm-action.js';
    import { bindTable } from './js/home-tables.js';
    import { SCOPE_EVENT, filterBySidebar, scopeCaption } from './js/scope.js';
    import { subsidiaryLabel } from './js/entity-scope.js';
    import { loadRows } from './js/ls-rows.js';
    import { KEYS as CAT_KEYS, SEED_GROUPS } from './js/catalog-seed.js';
    await mountUltimateShell();
    const app = document.getElementById('app');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function load() {
      const data = await loadRows('customer_groups', CAT_KEYS.groups, SEED_GROUPS);
      const rows = data.length ? data : SEED_GROUPS;
      app.innerHTML = `
        <h1>Customer Groups</h1>
        <p class="sub">${esc(scopeCaption())}</p>
        <div class="card" data-tbl="groups">
          <div class="head"><h2>All Customer Groups</h2><a class="add" href="/customer-group-edit.html">+ Add</a></div>
          <div class="bar">
            <label>Show <select data-tbl-size><option selected>25</option><option>50</option><option>100</option><option>200</option><option>500</option><option>1000</option><option>All</option></select> entries</label>
            <div class="grow"></div>
            <button type="button" data-exp="csv">Export CSV</button>
            <button type="button" data-exp="xls">Export Excel</button>
            <button type="button" data-exp="print">Print</button>
            <button type="button" data-exp="cols">Column visibility</button>
            <button type="button" data-exp="pdf">Export PDF</button>
            <input data-tbl-search placeholder="Search …" />
          </div>
          ${''}
          <div class="ult-table-wrap"><table class="ult-table">
            <thead><tr><th>Customer Group Name</th><th>Calculation Percentage (%)</th><th>Selling Price Group</th><th>Subsidiary</th><th>Action</th></tr></thead>
            <tbody>${rows.map((g) => `<tr>
              <td>${esc(g.name)}</td>
              <td>${esc(g.calculation_percentage ?? g.percent ?? 0)}</td>
              <td>${esc(g.price_group || g.selling_price_group || '')}</td>
              <td>${esc(subsidiaryLabel(g.subsidiary_code))}</td>
              <td><a class="btn-edit" href="/customer-group-edit.html?id=${g.id}">✎ Edit</a>
                  <button type="button" class="btn-del" data-del="${g.id}">🗑 Delete</button></td>
            </tr>`).join('') || '<tr data-dummy="1"><td colspan="4" style="text-align:center">No data available in table</td></tr>'}</tbody>
          </table></div>
          <div style="display:flex;justify-content:space-between;margin-top:10px"><div data-tbl-info></div><div class="pager" data-tbl-pager></div></div>
        </div>`;
      bindTable(app.querySelector('[data-tbl="groups"]'), { title: 'Customer Groups', storageKey: 'cust-groups' });
      app.querySelectorAll('[data-del]').forEach((b) => {
        b.onclick = async () => {
          if (!(await confirmAction('Delete this group?', 'This cannot be undone.'))) return;
          const { error } = await supabase.from('customer_groups').delete().eq('id', b.dataset.del);
          if (error) { ackResult(false, error.message); return; }
        ackResult(true);
          window.addEventListener(SCOPE_EVENT, load);
    load();
        };
      });
    }
    window.addEventListener(SCOPE_EVENT, load);
    load();
  </script>
</body>
</html>
