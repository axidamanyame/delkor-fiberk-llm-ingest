<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <link rel="stylesheet" href="/css/staff-learn.css" />
</head>
<body>
<main class="ult-main page" id="app">Loading training…</main>
<script type="module">
  import { mountUltimateShell, pageChrome } from './js/ultimate-shell.js';
  import { ackResult } from './js/confirm-action.js';
  import { TRAIN_MODULES, trainingBody } from './js/staff-learn.js';

  const session = await mountUltimateShell();
  if (!session) throw new Error('auth');
  const KEY = 'df_training_progress';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const save = (o) => localStorage.setItem(KEY, JSON.stringify(o));

  const app = document.getElementById('app');
  function paint() {
    const done = load();
    const n = TRAIN_MODULES.filter((m) => done[m.id]).length;
    app.innerHTML = `
      ${pageChrome('Training', n + ' of ' + TRAIN_MODULES.length + ' classroom modules marked complete.')}
      <div class="or-wrap" style="max-width:920px">
        <div class="or-card">
          <h2>Staff classroom</h2>
          <p>Complete these before extra role menus are switched on. Department packs (Accounting first) sit below — more departments will be added here.</p>
        </div>
        ${trainingBody(done)}
      </div>`;
    app.querySelectorAll('[data-toggle-mod]').forEach((btn) => {
      btn.onclick = () => btn.closest('.mod')?.classList.toggle('open');
    });
    app.querySelectorAll('[data-train]').forEach((btn) => {
      btn.onclick = () => {
        const cur = load();
        cur[btn.dataset.train] = true;
        save(cur);
        ackResult(true, 'Module saved as complete.');
        paint();
      };
    });
  }
  paint();
</script>
</body>
</html>
