<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Profile — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .pf-bar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
    .pf-bar a { display:inline-flex; align-items:center; gap:6px; background:#1e3a8a; color:#fff; text-decoration:none; border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; }
    .pf-bar a.sec { background:var(--ult-card); color:#1e3a8a; border:1px solid #c7d2fe; }
    .pf-grid { display:grid; gap:14px; }
    .pf-card { background:var(--ult-card); border:1px solid var(--ult-border); border-radius:12px; padding:16px 18px; }
    .pf-card h3 { margin:0 0 12px; font-size:15px; }
    .pf-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
    .pf-3 { display:grid; grid-template-columns:160px 1fr 1fr; gap:12px 16px; }
    .pf-id { display:grid; grid-template-columns:160px 1fr 220px; gap:16px; align-items:start; }
    @media (max-width: 820px) { .pf-2,.pf-3,.pf-id { grid-template-columns:1fr; } }
    .fld { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; }
    .fld input,.fld select,.fld textarea { font-weight:400; padding:8px 10px; border:1px solid var(--ult-border); border-radius:6px; font:inherit; width:100%; box-sizing:border-box; }
    .fld textarea { min-height:72px; }
    .pf-avatar { width:96px; height:96px; border-radius:50%; background:#e0e7ff; color:#3730a3; font-weight:800; font-size:28px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .pf-avatar img { width:100%; height:100%; object-fit:cover; }
    .btn-save { background:#4f46e5; color:#fff; border:0; border-radius:8px; padding:10px 20px; font-weight:700; cursor:pointer; }
    .pf-ok { color:#166534; font-weight:700; min-height:18px; }
    .pf-err { color:#b91c1c; font-weight:700; min-height:18px; }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { supabase } from './js/supabaseClient.js';
  import { mountUltimateShell, pageChrome } from './js/ultimate-shell.js';
  import { loadProfileExtra, saveProfileExtra, DEFAULT_PROFILE } from './js/calendar.js';
  import { esc } from './js/ls-rows.js';
  import { hydrateUser, findUser, isGated } from './js/access-gate.js';
  import { ackResult } from './js/confirm-action.js';
  import { publicJobLabel } from './js/staff-jobs.js';
  import { writeAudit } from './js/supabaseClient.js';
  import { writeActivity } from './js/staff-log.js';

  const session = await mountUltimateShell();
  if (!session) throw new Error('auth');
  const app = document.getElementById('app');
  const user = session.user;
  await hydrateUser(session);
  const me = findUser(session) || {};
  const gated = isGated(me);
  const homeHref = gated ? '/orientation.html' : '/dashboard.html';

  let extra = { ...DEFAULT_PROFILE, ...loadProfileExtra() };
  const meta = user.user_metadata || {};
  const full = String(me.full_name || meta.full_name || [me.first_name, me.last_name].filter(Boolean).join(' ') || '').trim();
  const parts = full.split(/\s+/).filter(Boolean);
  extra.email = user.email || me.email || extra.email;
  extra.first_name = me.first_name || extra.first_name || parts[0] || '';
  extra.last_name = me.last_name || extra.last_name || (parts.length > 1 ? parts.slice(1).join(' ') : '');
  extra.prefix = me.prefix || extra.prefix || '';
  extra.mobile = me.mobile || extra.mobile || '';
  extra.language = me.language || extra.language || 'English';
  extra.photo = extra.photo || me.photo || '';
  if (me.address_permanent) extra.perm_address = extra.perm_address || me.address_permanent;
  if (me.address_current) extra.curr_address = extra.curr_address || me.address_current;

  const inp = (id, label, val, extraAttr = '') =>
    `<div class="fld"><label for="${id}">${label}</label><input id="${id}" value="${esc(val || '')}" ${extraAttr} /></div>`;
  const sel = (id, label, val, opts) =>
    `<div class="fld"><label for="${id}">${label}</label><select id="${id}"><option value="">Please Select</option>${opts.map((o) =>
      `<option ${String(val) === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;

  function toast(msg, ok = true) {
    const t = app.querySelector('#pf-msg');
    if (!t) return;
    t.textContent = msg;
    t.className = ok ? 'pf-ok' : 'pf-err';
  }
  function val(id) { return app.querySelector('#' + id)?.value?.trim() || ''; }

  function gather() {
    return {
      ...extra,
      prefix: val('prefix'),
      first_name: val('first_name'),
      last_name: val('last_name'),
      email: val('email'),
      language: val('language'),
      dob: val('dob'),
      gender: val('gender'),
      marital: val('marital'),
      blood: val('blood'),
      mobile: val('mobile'),
      alt_phone: val('alt_phone'),
      family_phone: val('family_phone'),
      facebook: val('facebook'),
      twitter: val('twitter'),
      social1: val('social1'),
      social2: val('social2'),
      custom1: val('custom1'),
      custom2: val('custom2'),
      custom3: val('custom3'),
      custom4: val('custom4'),
      guardian: val('guardian'),
      id_name: val('id_name'),
      id_number: val('id_number'),
      perm_address: val('perm_address'),
      curr_address: val('curr_address'),
      bank_holder: val('bank_holder'),
      bank_number: val('bank_number'),
      bank_name: val('bank_name'),
      bank_bic: val('bank_bic'),
      bank_branch: val('bank_branch'),
      tax_payer_id: val('tax_payer_id'),
      photo: extra.photo,
    };
  }

  function paint() {
    const initials = ((extra.first_name || 'D')[0] + (extra.last_name || 'F')[0]).toUpperCase();
    app.innerHTML = `
      ${pageChrome('My Profile', extra.first_name ? (extra.first_name + ' ' + extra.last_name) : (user.email || ''))}
      <div class="pf-bar">
        <a href="${homeHref}">← Home</a>
        ${gated ? '<a class="sec" href="/orientation.html">Orientation</a>' : ''}
        <a class="sec" href="/welcome-package.html">Welcome package</a>
      </div>
      <p id="pf-msg" class="pf-ok"></p>

      <div class="pf-grid">
        <div class="pf-card">
          <h3>Identity</h3>
          <div class="pf-id">
            <div>
              ${sel('prefix', 'Prefix', extra.prefix, ['Mr.', 'Mrs.', 'Miss', 'Ms.', 'Dr.'])}
              ${inp('first_name', 'First name', extra.first_name)}
              ${inp('last_name', 'Last name', extra.last_name)}
            </div>
            <div>
              ${inp('email', 'Email', extra.email, 'type="email" readonly')}
              ${sel('language', 'Language', extra.language, ['English', 'Twi', 'Ga', 'Ewe', 'French'])}
              ${inp('mobile', 'Mobile', extra.mobile)}
              <div class="fld"><label>Position</label><input value="${esc(publicJobLabel({ ...me, email: user.email, designation: me.designation || extra.designation }, user.email))}" readonly /></div>
            </div>
            <div>
              <div class="pf-avatar">${extra.photo ? `<img src="${extra.photo}" alt="Photo" />` : `<span>${esc(initials)}</span>`}</div>
              <label class="fld" style="margin-top:8px">Photo<input id="photo" type="file" accept="image/*" /></label>
              <p class="ult-muted">Max 5MB</p>
            </div>
          </div>
        </div>

        <div class="pf-card">
          <h3>Personal</h3>
          <div class="pf-2">
            ${inp('dob', 'Date of birth', extra.dob, 'type="date"')}
            ${sel('gender', 'Gender', extra.gender, ['Male', 'Female', 'Other'])}
            ${sel('marital', 'Marital status', extra.marital, ['Single', 'Married', 'Divorced', 'Widowed'])}
            ${inp('blood', 'Blood group', extra.blood)}
            ${inp('guardian', 'Guardian name', extra.guardian)}
            ${inp('family_phone', 'Family contact', extra.family_phone)}
          </div>
        </div>

        <div class="pf-card">
          <h3>Contact & address</h3>
          <div class="pf-2">
            ${inp('alt_phone', 'Alternate number', extra.alt_phone)}
            ${inp('id_name', 'ID type', extra.id_name || 'Ghana Card')}
            ${inp('id_number', 'ID number', extra.id_number)}
            ${inp('tax_payer_id', 'TIN', extra.tax_payer_id)}
            <div class="fld"><label for="perm_address">Permanent address</label><textarea id="perm_address">${esc(extra.perm_address)}</textarea></div>
            <div class="fld"><label for="curr_address">Current address</label><textarea id="curr_address">${esc(extra.curr_address)}</textarea></div>
          </div>
        </div>

        <div class="pf-card">
          <h3>Bank</h3>
          <div class="pf-2">
            ${inp('bank_holder', "Account holder's name", extra.bank_holder)}
            ${inp('bank_number', 'Account number', extra.bank_number)}
            ${inp('bank_name', 'Bank name', extra.bank_name)}
            ${inp('bank_branch', 'Branch', extra.bank_branch)}
            ${inp('bank_bic', 'Bank code / BIC', extra.bank_bic)}
          </div>
        </div>

        <div class="pf-card">
          <h3>Social (optional)</h3>
          <div class="pf-2">
            ${inp('facebook', 'Facebook', extra.facebook)}
            ${inp('twitter', 'X / Twitter', extra.twitter)}
            ${inp('social1', 'Social 1', extra.social1)}
            ${inp('social2', 'Social 2', extra.social2)}
          </div>
        </div>

        <div class="pf-card">
          <h3>Change password</h3>
          <form id="pw-form" autocomplete="on">
          <div class="pf-2">
            <div class="fld"><label for="cur_pw">Current password</label><input id="cur_pw" name="current-password" type="password" autocomplete="current-password" /></div>
            <div class="fld"><label for="new_pw">New password</label><input id="new_pw" name="new-password" type="password" autocomplete="new-password" /></div>
            <div class="fld"><label for="cfm_pw">Confirm new password</label><input id="cfm_pw" name="confirm-password" type="password" autocomplete="new-password" /></div>
          </div>
          <p style="margin:12px 0 0"><button type="submit" class="btn-save" id="pw-save">Update password</button></p>
          </form>
        </div>

        <div class="pf-bar">
          <button type="button" class="btn-save" id="pf-save">Save profile</button>
          <a class="sec" href="${homeHref}" style="background:#fff;color:#1e3a8a;border:1px solid #c7d2fe;border-radius:8px;padding:10px 16px;text-decoration:none;font-weight:700">← Back to Home</a>
        </div>
      </div>
    `;

    app.querySelector('#pw-form').onsubmit = async (ev) => {
      ev.preventDefault();
      const cur = val('cur_pw');
      const nw = val('new_pw');
      const cf = val('cfm_pw');
      if (!nw || nw.length < 6) return toast('New password must be at least 6 characters.', false);
      if (nw !== cf) return toast('New password and confirmation do not match.', false);
      if (!cur) return toast('Enter current password.', false);
      try {
        const { error } = await supabase.auth.updateUser({ password: nw });
        if (error) return toast(error.message, false);
      } catch (e) { return toast(String(e.message || e), false); }
      toast('Password updated.');
      ackResult(true, 'Password updated.');
      app.querySelector('#cur_pw').value = '';
      app.querySelector('#new_pw').value = '';
      app.querySelector('#cfm_pw').value = '';
    };
    app.querySelector('#photo').onchange = (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      if (f.size > 5 * 1024 * 1024) return toast('Max file size is 5MB.', false);
      const r = new FileReader();
      r.onload = () => { extra.photo = r.result; paint(); };
      r.readAsDataURL(f);
    };
    app.querySelector('#pf-save').onclick = async () => {
      extra = gather();
      saveProfileExtra(extra);
      const name = `${extra.first_name} ${extra.last_name}`.trim();
      try {
        await supabase.from('profiles').update({
          full_name: name || null,
          first_name: extra.first_name || null,
          last_name: extra.last_name || null,
          prefix: extra.prefix || null,
          email: extra.email || user.email,
          mobile: extra.mobile || null,
        }).eq('id', user.id);
      } catch { /* demo / missing column */ }
      toast('Profile saved.');
      ackResult(true, 'Profile saved.');
      try {
        await writeAudit({
          action: 'PROFILE_UPDATE',
          entity_type: 'profile',
          entity_id: user.id,
          summary: (name || extra.email || user.email) + ' updated their profile',
          payload: { email: extra.email, mobile: extra.mobile },
        });
        writeActivity({
          action: 'profile_update',
          type: 'Profile',
          by: extra.email || user.email,
          user_id: user.id,
          note: 'Updated own profile details',
        });
      } catch { /* ignore */ }
    };
  }

  paint();
</script>
</body>
</html>
