<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
</head>
<body class="wms-hub">
<main class="ult-main page" id="app">Loading WMS…</main>
<script type="module">
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { bootWmsHub } from './js/wms-hub.js';
  try {
    const session = await mountUltimateShell();
    if (!session) throw new Error('auth');
    await bootWmsHub(session);
  } catch (err) {
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div class="st-card"><h1>WMS</h1><p>${String(err?.message || err)}</p></div>`;
  }
</script>
</body>
</html>
