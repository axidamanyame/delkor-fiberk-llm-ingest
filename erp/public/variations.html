<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variations</title>
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .page{color:#111} h1{margin:0;font-size:22px} .sub{color:#3d4f66;font-size:14px;font-weight:400}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
    .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .add{background:#4f46e5;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
    .bar .grow{flex:1}
    .bar select,.bar input,.bar button{border:1px solid #111;background:#fff;border-radius:8px;padding:5px 10px;font-size:12px}
    table.ult-table th,table.ult-table td{color:#111}
    .pill{border-radius:999px;padding:4px 10px;font-size:12px;text-decoration:none;border:1px solid;margin-right:6px;cursor:pointer;background:#fff}
    .edit{color:#6d28d9;border-color:#c4b5fd}
    .del{color:#e11d48;border-color:#fda4af}
    .col-vis-menu,.pdf-orient{position:absolute;top:28px;background:#fff;border:1px solid #111;border-radius:8px;padding:8px;z-index:40}
    .pager button{border:1px solid #111;background:#fff;padding:4px 10px}
    .pager button.on{background:#1d4ed8;color:#fff}
  </style>
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { supabase } from './js/supabaseClient.js';
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { confirmAction, ackResult } from './js/confirm-action.js';
  import { SCOPE_EVENT, filterBySidebar, scopeCaption } from './js/scope.js';
  import { bindTable } from './js/home-tables.js';
  import { loadRows } from './js/ls-rows.js';
  import { KEYS as CAT_KEYS, SEED_VARIATIONS } from './js/catalog-seed.js';
  await mountUltimateShell();
  const app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function load() {
    const data = await loadRows('product_variations', CAT_KEYS.variations, SEED_VARIATIONS);
    const rows = data.length ? data : SEED_VARIATIONS;
    app.innerHTML = `
      <h1>Variations <span class="sub">Manage product variations</span></h1>
      <p>${esc(scopeCaption())}</p>
      <div class="card" data-tbl="t">
        <div class="head"><h2>Manage product variations</h2><a class="add" href="/variation-edit.html">+ Add</a></div>
        <div class="bar">
          <label>Show <select data-tbl-size><option selected>25</option><option>50</option><option>100</option><option>All</option></select> entries</label>
          <div class="grow"></div>
          <button type="button" data-exp="csv">Export CSV</button>
          <button type="button" data-exp="xls">Export Excel</button>
          <button type="button" data-exp="print">Print</button>
          <button type="button" data-exp="cols">Column visibility</button>
          <button type="button" data-exp="pdf">Export PDF</button>
          <input data-tbl-search placeholder="Search …" />
        </div>
        ${''}
        <div class="ult-table-wrap"><table class="ult-table">
          <thead><tr><th>Variations</th><th>Values</th><th>Action</th></tr></thead>
          <tbody>${rows.map((r) => `<tr><td>${esc(r.name)}</td><td>${esc(r.values || r.value_list || '')}</td><td><a class="pill edit" href="/variation-edit.html?id=${r.id}">Edit</a>
            <button type="button" class="pill del" data-del="${r.id}">Delete</button></td></tr>`).join('') || '<tr data-dummy="1"><td colspan="3" style="text-align:center">No data available in table</td></tr>'}</tbody>
        </table></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px"><div data-tbl-info></div><div class="pager" data-tbl-pager></div></div>
      </div>`;
    bindTable(app.querySelector('[data-tbl="t"]'), { title: 'Variations', storageKey: 'variations' });
    app.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!(await confirmAction('Delete this row?', 'This cannot be undone.'))) return;
        const { error } = await supabase.from('product_variations').delete().eq('id', b.dataset.del);
        if (error) { ackResult(false, error.message); return; }
        ackResult(true);
        load();
      };
    });
  }
  window.addEventListener(SCOPE_EVENT, load);
  load();
</script>
</body>
</html>
