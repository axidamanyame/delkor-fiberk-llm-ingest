<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Dashboards — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <link rel="stylesheet" href="/css/custom-dashboards.css" />

</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { bootCustomDashboards } from './js/custom-dashboards-page.js';
  try {
    const session = await mountUltimateShell();
    if (!session) throw new Error('auth');
    await bootCustomDashboards();
  } catch (err) {
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div class="card" style="padding:24px"><h1>Custom Dashboards</h1><p>${String(err?.message || err)}</p></div>`;
  }
</script>
</body>
</html>
