<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Delkor-Fiberk ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .home { color: var(--ult-text); overflow-x: hidden; min-width: 0; max-width: 100%; }
    #app.ult-main { overflow-x: hidden; min-width: 0; max-width: 100%; }
    .home-hero {
      background: linear-gradient(105deg, #c5e8fb 0%, #d4eef8 38%, #d9f6e8 72%, #e7f9dc 100%);
      color: #0f3d4c;
      border-radius: 0 0 16px 16px;
      margin: -20px -24px 16px;
      padding: 16px 24px 78px;
    }
    .home-hero-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .home-hero h1 { margin:0; font-size:28px; font-weight:800; color:#0f3d4c; }
    [data-theme="dark"] .home-hero {
      background: linear-gradient(105deg, #1e3a8a 0%, #164e63 55%, #14532d 100%);
      color: #ecfeff;
    }
    [data-theme="dark"] .home-hero h1 { color: #ecfeff; }
    .home-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:-62px 0 16px; }
    @media (max-width:1100px){ .home-kpis{grid-template-columns:1fr 1fr;} }
    @media (max-width:640px){
      .home-kpis{grid-template-columns:1fr;}
      .home-hero { margin:-12px -12px 16px; padding:14px 14px 72px; }
      .home-hero h1 { font-size:22px; }
      .home { overflow-x: hidden; }
    }
    .home-kpi { background:var(--ult-card); border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:center; box-shadow:0 6px 18px rgba(15,23,42,.10); border:1px solid var(--ult-border); }
    .home-kpi .ico { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .home-kpi .lab { font-size:13px; color:var(--ult-text); font-weight:600; }
    .home-kpi .val { font-size:20px; font-weight:800; color:var(--ult-text); }
    .tip { display:inline-flex; width:14px; height:14px; border-radius:50%; background:#0ea5e9; color:#fff; font-size:10px; align-items:center; justify-content:center; margin-left:4px; cursor:help; }
    .home-card { background:var(--ult-card); border:1px solid var(--ult-border); border-radius:12px; padding:16px 16px 10px; margin-bottom:14px; color:var(--ult-text); min-width:0; max-width:100%; }
    .home-card h3 { margin:0 0 12px; font-size:16px; color:var(--ult-text); display:flex; align-items:center; gap:8px; }
    .home-split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; width:100%; max-width:100%; min-width:0; }
    .home-split > .home-card { overflow:hidden; display:flex; flex-direction:column; min-width:0; max-width:100%; }
    .home-split .ult-table-wrap,
    .home-split .table-wrapper {
      overflow:auto !important;
      max-width:100% !important;
      max-height:min(48vh, 440px);
      width:100% !important;
    }
    .home-split .erp-top-bar,
    .home-split .tbl-bar { flex-wrap:wrap; max-width:100%; min-width:0; }
    @media (max-width:980px){ .home-split{grid-template-columns:minmax(0,1fr);} }
    .date-dd { position:relative; }
    .date-dd > button { background:var(--ult-card); color:var(--ult-text); border:0; border-radius:8px; padding:8px 12px; font-weight:700; cursor:pointer; }
    .date-menu { position:absolute; right:0; top:40px; background:var(--ult-card); min-width:230px; border-radius:8px; box-shadow:0 12px 30px rgba(0,0,0,.18); z-index:30; overflow:hidden; }
    .date-menu button { display:block; width:100%; text-align:left; border:0; background:var(--ult-card); color:var(--ult-text); padding:8px 14px; cursor:pointer; font:inherit; }
    .date-menu button:hover, .date-menu button.on { background:#1d4ed8; color:#fff; }
    .tbl-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .tbl-bar .grow { flex:1; }
    .tbl-tools { display:flex; flex-wrap:wrap; gap:6px; }
    .tbl-tools button, .tbl-bar select, .tbl-bar input, .tbl-bar .loc-filter {
      border:1px solid #111; background:var(--ult-card); color:var(--ult-text); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer;
    }
    .tbl-bar input { cursor:text; min-width:140px; border-radius:6px; }
    .home table.ult-table th, .home table.ult-table td { color:var(--ult-text); border-color:var(--ult-border); }
    .home table.ult-table th { background:var(--ult-card-2); font-weight:800; }
    .home table.ult-table tbody tr:nth-child(even) { background:var(--ult-card-2); }
    .pager { display:flex; justify-content:flex-end; gap:6px; padding:8px 0; }
    .pager button { border:1px solid #111; background:var(--ult-card); color:var(--ult-text); padding:4px 10px; border-radius:4px; cursor:pointer; }
    .pager button.on { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
    .pager button:disabled { opacity:.35; cursor:not-allowed; }
    .col-vis-menu { position:absolute; top:28px; left:0; background:var(--ult-card); border:1px solid #111; border-radius:8px; padding:8px 10px; z-index:40; min-width:180px; color:var(--ult-text); }
    .col-vis-menu label { display:flex; gap:6px; align-items:center; padding:3px 0; font-size:13px; color:var(--ult-text); }
    .line-wrap { height:280px; }
    .hc-chart{position:relative;background:var(--ult-card);border:1px solid var(--ult-border);border-radius:12px;padding:12px 8px 8px;margin:0 0 16px;width:100%;box-sizing:border-box}
    .hc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 8px}
    .hc-head h3{margin:0;font-size:16px;color:var(--ult-text)}
    .hc-tools{display:flex;align-items:center;gap:12px}
    .hc-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;font-size:12px;color:var(--ult-text)}
    .hc-legend .lg{display:inline-flex;align-items:center;gap:6px}
    .hc-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
    .hc-burger{border:1px solid var(--ult-border);background:var(--ult-card);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:16px;color:var(--ult-text)}
    .hc-body{height:380px;width:100%}
    .home-charts{margin:0 -24px 8px;padding:0 8px}
    @media (max-width:640px){ .home-charts{margin:0 -12px 8px;padding:0 4px} .hc-body{height:280px} }
    .hc-tip{position:absolute;z-index:5;background:var(--ult-card);border:1px solid var(--ult-border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ult-text);box-shadow:0 8px 18px rgba(15,23,42,.12);pointer-events:none}
    .hc-menu{position:absolute;right:12px;top:42px;background:var(--ult-card);border:1px solid var(--ult-border);border-radius:8px;box-shadow:0 12px 28px rgba(15,23,42,.16);z-index:20;min-width:220px;padding:6px 0}
    .hc-menu button{display:block;width:100%;text-align:left;border:0;background:var(--ult-card);padding:8px 14px;font:inherit;font-size:13px;color:var(--ult-text);cursor:pointer}
    .hc-menu button:hover{background:#f1f5f9}
    .hc-menu hr{border:0;border-top:1px solid var(--ult-border);margin:4px 0}
    .hc-chart.hc-fs{position:fixed;inset:16px;z-index:80;margin:0;box-shadow:0 24px 60px rgba(15,23,42,.28)}
    .hc-chart.hc-fs .hc-body{height:calc(100% - 48px)}
    .line-wrap svg { width:100%; height:100%; }
    .act a, .act .pill { border:1px solid #111; background:var(--ult-card); color:var(--ult-text); border-radius:6px; padding:2px 8px; font-size:12px; text-decoration:none; margin-right:0; cursor:pointer; font-family:inherit; display:inline-block; }
    .act-stack { display:flex; flex-direction:column; align-items:flex-start; gap:8px; width:max-content; }
    .act-row { display:flex; flex-flow:row nowrap; gap:6px; align-items:center; white-space:nowrap; }
    .act .pill.del { color:#b91c1c; border-color:#fecaca; }
    .chart-legend { text-align:right; font-size:12px; color:var(--ult-text); margin-bottom:4px; }
  </style>
</head>
<body>
  <main class="ult-main home" id="app">
    <div class="home-hero"><div class="home-hero-row"><div>
      <h1>Welcome</h1>
      <p style="margin:6px 0 0;opacity:.9">Opening Home…</p>
    </div></div></div>
  </main>
  <script type="module">
    import { supabase, fmt, getActiveSubsidiary } from './js/supabaseClient.js';
    import { mountUltimateShell } from './js/ultimate-shell.js';
    import { getActiveLocation, findLocation, SCOPE_EVENT, locationsFor, filterBySidebar, salesOrderMatchesScope } from './js/scope.js';
    import { loadMyProfile, isHqRole, isOwnerRole } from './js/access-rules.js';
    import { bindTable } from './js/home-tables.js';
    import { loadAccess, getAccess, can } from './js/rbac.js';
    import { inferGroup, homeForGroup } from './js/dashboards.js';
    import { bindSalesChart, seriesByLocation, seriesBySubsidiary } from './js/sales-chart.js';
    import { mergeRows, readLsAll } from './js/ls-rows.js';
    import { KEYS as CAT_KEYS, SEED_PRODUCTS, isDemoProduct, isCirculatingProduct, withoutDemo } from './js/catalog-seed.js';
    import { confirmAction, ackResult } from './js/confirm-action.js';
    import { crudButtons, bindDeletes } from './js/admin-crud.js';
    import { ensureOpeningPurchaseDues, openAddPurchasePayment } from './js/opening-dues.js';
    import { toIsoDate } from './js/fiberk-silo.js';
    import { chartLocationName, normaliseScope } from './js/legacy-scope-map.js';
    import { listAlerts, pullAlerts } from './js/till-open.js';
    import { myKpi } from './js/staff-kpi.js';

    const session = await mountUltimateShell();
    const app = document.getElementById('app');
    if (session) {
    function escNow(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }
    const whoNow = session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || 'Admin';
    app.innerHTML = `<div class="home-hero"><div class="home-hero-row"><div>
      <h1>Welcome ${escNow(whoNow)}, 👋</h1>
      <p style="margin:6px 0 0;opacity:.9">Loading figures for the selected company…</p>
    </div></div></div>`;
    let profile = {};
    loadMyProfile().then((p) => { profile = p || profile; }).catch(() => {});

    const RANGES = [
      ['today','Today'],['yesterday','Yesterday'],['7','Last 7 Days'],['30','Last 30 Days'],
      ['month','This Month'],['last_month','Last Month'],['month_ly','This month last year'],
      ['year','This Year'],['last_year','Last Year'],['fy','Current financial year'],
      ['last_fy','Last financial year'],['custom','Custom Range'],
    ];
    let range = 'fy', customFrom = '', customTo = '';
    try {
      const saved = sessionStorage.getItem('df_home_range');
      if (saved && RANGES.some(([k]) => k === saved)) range = saved;
      customFrom = sessionStorage.getItem('df_home_from') || '';
      customTo = sessionStorage.getItem('df_home_to') || '';
    } catch { /* ignore */ }
    let loadGen = 0;
    const accraYmd = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Accra' });
    const ymd = (d) => {
      if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0, 10);
      try { return new Date(d).toLocaleDateString('en-CA', { timeZone: 'Africa/Accra' }); }
      catch { return String(d || '').slice(0, 10); }
    };
    const start = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
    function rangeBounds(key) {
      const today = accraYmd();
      const [y, mo] = today.split('-').map(Number);
      const m = mo - 1;
      const now = start(`${today}T00:00:00`);
      if (key === 'today') return { from: today, to: today };
      if (key === 'yesterday') { const d = new Date(now); d.setDate(d.getDate()-1); return { from:ymd(d), to:ymd(d) }; }
      if (key === '7' || key === '30') { const d = new Date(now); d.setDate(d.getDate()-(Number(key)-1)); return { from:ymd(d), to:ymd(now) }; }
      if (key === 'month') return { from: ymd(new Date(y,m,1)), to: today };
      if (key === 'last_month') return { from: ymd(new Date(y,m-1,1)), to: ymd(new Date(y,m,0)) };
      if (key === 'month_ly') return { from: ymd(new Date(y-1,m,1)), to: ymd(new Date(y-1,m+1,0)) };
      if (key === 'year' || key === 'fy') return { from: y+'-01-01', to: today };
      if (key === 'last_year' || key === 'last_fy') return { from: (y-1)+'-01-01', to: (y-1)+'-12-31' };
      if (key === 'custom' && customFrom && customTo) return { from: customFrom, to: customTo };
      return { from: ymd(now), to: ymd(now) };
    }
    function rangeAxis(from, to, forceKind) {
      const a = start(`${from}T00:00:00`);
      const b = start(`${to}T00:00:00`);
      const n = Math.max(1, Math.round((b - a) / 86400000) + 1);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const useDays = forceKind === 'day' || (forceKind !== 'month' && n <= 62);
      if (useDays) {
        const keys = []; const labels = [];
        for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
          keys.push(ymd(d));
          labels.push(d.getDate() + ' ' + d.toLocaleString('en-GB', { month: 'short' }));
        }
        return { keys, labels, kind: 'day', keyOf: (row) => dateOf(row) };
      }
      const keys = []; const labels = [];
      let y = a.getFullYear(); let m = a.getMonth();
      const endY = b.getFullYear(); const endM = b.getMonth();
      while (y < endY || (y === endY && m <= endM)) {
        const key = y + '-' + String(m + 1).padStart(2, '0');
        keys.push(key);
        labels.push(months[m] + (endY !== a.getFullYear() ? ' ' + String(y).slice(2) : ''));
        m += 1; if (m === 12) { m = 0; y += 1; }
      }
      return { keys, labels, kind: 'month', keyOf: (row) => dateOf(row).slice(0, 7) };
    }
    /** Day-axis chart follows the selected window day-by-day. Year-axis chart always plots Jan–Dec of the year that window belongs to. */
    const DAY_FILTERS = new Set(['today','yesterday','7','30','month','last_month','month_ly']);
    const YEAR_FILTERS = new Set(['year','last_year','fy','last_fy']);
    function periodAxisFor(rangeKey, from, to) {
      if (DAY_FILTERS.has(rangeKey)) return rangeAxis(from, to, 'day');
      if (YEAR_FILTERS.has(rangeKey)) return rangeAxis(from, to, 'month');
      return rangeAxis(from, to);
    }
    function yearAxisFor(from, rows) {
      let y = Number(String(from).slice(0, 4)) || Number(accraYmd().slice(0, 4));
      const sums = {};
      (rows || []).forEach((r) => {
        const yy = dateOf(r).slice(0, 4);
        if (/^\d{4}$/.test(yy)) sums[yy] = (sums[yy] || 0) + saleAmt(r);
      });
      if (!(sums[y] > 0)) {
        const best = Object.keys(sums).map(Number).filter((n) => sums[n] > 0).sort((a, b) => b - a)[0];
        if (best) y = best;
      }
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return {
        keys: months.map((_, i) => y + '-' + String(i + 1).padStart(2, '0')),
        labels: months,
        kind: 'month',
        year: y,
        keyOf: (row) => dateOf(row).slice(0, 7),
      };
    }
    function chartSeries(rows, axis) {
      const sub = getActiveSubsidiary()?.code;
      const allSubs = !sub || sub === 'group' || sub === 'ops';
      if (allSubs) return seriesBySubsidiary(rows, axis.keys, liveSale, axis.keyOf);
      return seriesByLocation(rows, axis.keys, liveSale, axis.keyOf);
    }
    function dateOf(row) {
      return toIsoDate(row.order_date || row.transaction_date || row.delivery_at || row.transfer_at || row.invoice_date || row.expense_date || row.return_date || row.shipped_on || row.created_at || row.date || '');
    }
    function saleAmt(row) {
      return Number(row?.total_amount || row?.final_total || row?.grand_total || row?.total || 0);
    }
    function compactSale(row) {
      if (!row || typeof row !== 'object') return null;
      return {
        ...row,
        source: row.source || 'fiberkapp',
        status: row.status || 'final',
        total_amount: saleAmt(row),
        amount_paid: Number(row.amount_paid || 0),
        live: true,
      };
    }
    let dumpSalesCache = null;
    async function fiberkDumpSales() {
      if (dumpSalesCache) return dumpSalesCache;
      try {
        const res = await fetch('/js/fiberkapp-dump/sales.json', { cache: 'force-cache' });
        if (!res.ok) { dumpSalesCache = []; return dumpSalesCache; }
        const data = await res.json();
        dumpSalesCache = (Array.isArray(data) ? data : []).map(compactSale).filter(Boolean);
      } catch { dumpSalesCache = []; }
      return dumpSalesCache;
    }
    async function loadSalesBook() {
      const local = mergeRows([
        readLsAll('df_fiberk_sales_headers'),
        readLsAll('df_sales_orders'),
      ]).map(compactSale).filter(Boolean);
      const fiberkN = local.filter((r) => String(r.source || '').toLowerCase() === 'fiberkapp').length;
      if (fiberkN >= 100) return local;
      const dump = await fiberkDumpSales();
      return mergeRows([local, dump]);
    }
    function inRange(row, from, to) { const d = dateOf(row); return d && d >= from && d <= to; }
    function subAlias(code) {
      const c = String(code || '').toLowerCase();
      if (c === 'buynowpayslater' || c === 'buy-now-pays-later') return 'bnpl';
      if (c === 'axidigetek') return 'axidigetek';
      if (c === 'fiberk') return 'fiberk';
      if (c === 'delkor' || c === 'delkor-logistics') return 'delkor';
      return c;
    }
    function inferSub(row) {
      const raw = subAlias(row.subsidiary_code || row.home_subsidiary || row.company_code || '');
      if (raw && raw !== 'group' && raw !== 'ops') return raw;
      const blob = `${row.location_code || ''} ${row.location_name || ''} ${row.legacy_location || ''}`.toLowerCase();
      const hit = findLocation(row.location_code);
      if (hit?.subsidiary) return subAlias(hit.subsidiary);
      if (/easybuy|bnpl|field/.test(blob)) return 'bnpl';
      if (/fiberk/.test(blob)) return 'fiberk';
      if (/delkor|furniture/.test(blob)) return 'delkor';
      if (/axidigetek|jumia|\baxi\b/.test(blob)) return 'axidigetek';
      return '';
    }
    function scopeSale(row) {
      const stamped = { ...row, subsidiary_code: inferSub(row) || row.subsidiary_code };
      return salesOrderMatchesScope(normaliseScope(stamped));
    }
    function scopeRow(row) {
      const stamped = { ...row, subsidiary_code: inferSub(row) || row.subsidiary_code };
      return filterBySidebar([stamped]).length === 1;
    }
    const liveSale = (s) => !/draft|quot|cancel/i.test(s.status || '');
    const duePay = (s) => Math.max(0, Number(s.total_amount || s.grand_total || 0) - Number(s.amount_paid || 0)) > 0.004;
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function lineSvg(points, color='#38bdf8') {
      const w=1100,h=260,pad=40;
      const max = Math.max(1, ...points.map((p)=>p.v));
      const step = (w-pad*2)/Math.max(1, points.length-1);
      const xy = points.map((p,i)=>({ x: pad+i*step, y: h-pad-(p.v/max)*(h-pad*2), ...p }));
      const d = xy.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');
      const grid = [0,.25,.5,.75,1].map((t)=>{
        const y=h-pad-t*(h-pad*2);
        return `<line x1="${pad}" x2="${w-pad}" y1="${y}" y2="${y}" stroke="#d1d5db"/><text x="2" y="${y+4}" font-size="11" fill="#111">${Math.round(max*t)}</text>`;
      }).join('');
      const dots = xy.map((p)=>`<circle cx="${p.x}" cy="${p.y}" r="3.2" fill="${color}" stroke="#fff" stroke-width="1.4"/>`).join('');
      const labels = xy.filter((_,i)=>!(i%Math.ceil(points.length/10))||i===points.length-1)
        .map((p)=>`<text x="${p.x}" y="${h-10}" text-anchor="middle" font-size="10" fill="#111">${p.l}</text>`).join('');
      return `<svg viewBox="0 0 ${w} ${h}">${grid}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4"/>${dots}${labels}</svg>`;
    }
    function toolbar(opts={}) {
      return `<div class="tbl-bar">
        ${opts.size?`<label>Show <select data-tbl-size><option selected>25</option><option>50</option><option>100</option><option>200</option><option>500</option><option>1000</option><option>All</option></select> entries</label>`:''}
        ${opts.loc?`<select class="loc-filter" data-loc-filter><option value="">Select location</option>${opts.locOpts||''}</select>`:''}
        <div class="grow"></div>
        <div class="tbl-tools">
          <button type="button" data-exp="csv">Export CSV</button>
          <button type="button" data-exp="xls">Export Excel</button>
          <button type="button" data-exp="print">Print</button>
          <button type="button" data-exp="cols">Column visibility</button>
          <button type="button" data-exp="pdf">Export PDF</button>
        </div>
        ${opts.search?`<input data-tbl-search placeholder="Search …" />`:''}
      </div>`;
    }
    const emptyRow = (n) => `<tr data-dummy="1"><td colspan="${n}" style="text-align:center">No data available in table</td></tr>`;
    const foot = () => `<div data-tbl-info></div><div class="pager" data-tbl-pager></div>`;

    function isOfficeHome() {
      const ctx = getAccess();
      if (ctx?.isAdmin) return true;
      const n = String(ctx?.roleName || profile?.role || profile?.role_name || '').toLowerCase();
      return /admin|owner|manager|hq|founder|accountant|auditor|supervisor/.test(n);
    }
    function mineSale(s) {
      const uid = session.user.id;
      const mail = String(session.user.email || '').toLowerCase();

      bindTable(app.querySelector('[data-tbl="stock"]'), { title:'Product Stock Alert', storageKey:'home-stock', table:'products', key: CAT_KEYS.products, onDone: load });
      bindTable(app.querySelector('[data-tbl="orders"]'), { title:'Sales Order', storageKey:'home-orders', table:'sales_orders', key: CAT_KEYS.sales, onDone: load });
      bindTable(app.querySelector('[data-tbl="ships"]'), { title:'Pending Shipments', storageKey:'home-ships', table:'shipments', key:'df_shipments', onDone: load });
      bindDeletes(app.querySelector('[data-tbl="sales-due"]'), { table: 'sales_orders', key: CAT_KEYS.sales, label: 'this invoice', onDone: load });
      bindDeletes(app.querySelector('[data-tbl="orders"]'), { table: 'sales_orders', key: CAT_KEYS.sales, label: 'this sales order', onDone: load });
      bindDeletes(app.querySelector('[data-tbl="purch-due"]'), { table: 'purchase_orders', key: 'df_purchase_orders', label: 'this purchase', onDone: load });
      app.querySelectorAll('[data-pay]').forEach((b) => {
        b.onclick = () => {
          const id = b.dataset.pay;
          const row = duePurch.find((r) => String(r.id) === String(id));
          if (row) openAddPurchasePayment(row, () => load());
        };
      });
      bindDeletes(app.querySelector('[data-tbl="ships"]'), { table: 'shipments', key: 'df_shipments', label: 'this shipment', onDone: load });
      bindDeletes(app.querySelector('[data-tbl="stock"]'), { table: 'products', key: CAT_KEYS.products, label: 'this product', onDone: load });
      if (document.getElementById('chart-30')) bindSalesChart(document.getElementById('chart-30'), {
        title: 'Sales · ' + rangeLabel,
        yLabel: 'Total Sales (GHS)',
        labels: axis.labels,
        series: last30series,
        file: 'sales-range',
        xKind: axis.kind,
      });
      if (document.getElementById('chart-fy')) bindSalesChart(document.getElementById('chart-fy'), {
        title: 'Sales Current Financial Year · ' + fyAxis.year,
        yLabel: 'Total Sales (GHS)',
        labels: fyAxis.labels,
        series: fySeries,
        file: 'sales-financial-year',
        xKind: 'month',
        markIndex: markMonth,
      });

      app.querySelector('[data-loc-filter]')?.addEventListener('change', (e)=>{
        const code=e.target.value;
        app.querySelectorAll('[data-tbl="sales-due"] tbody tr').forEach((tr)=>{
          if (tr.dataset.dummy==='1') return;
          tr.hidden = !!(code && tr.dataset.loc && tr.dataset.loc!==code);
        });
      });
      } catch (err) {
        console.warn('home load', err);
        app.innerHTML = `<div class="home-hero"><div class="home-hero-row"><div>
          <h1>Welcome</h1>
          <p style="margin:8px 0 0;opacity:.9">Home could not finish loading (${esc(err?.message || 'network')}). Menu on the left still works.</p>
        </div></div></div>`;
      }
    }
    window.addEventListener(SCOPE_EVENT, load);
    load();
    }
  </script>
</body>
</html>
