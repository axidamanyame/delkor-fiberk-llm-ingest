<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Academy — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <link rel="stylesheet" href="/css/manual-ref.css" />
</head>
<body>
  <main class="ult-main page" id="app">Opening Academy…</main>
  <script type="module">
    import { mountUltimateShell } from './js/ultimate-shell.js';
    import { bootAcademyHub } from './js/academy-hub.js';
    try {
      const session = await mountUltimateShell();
      if (!session) throw new Error('auth');
      await bootAcademyHub();
    } catch (err) {
      const app = document.getElementById('app');
      if (app) app.innerHTML = `<div class="card" style="padding:24px"><h1>Academy</h1><p>${String(err?.message || err)}</p></div>`;
    }
  </script>
</body>
</html>
