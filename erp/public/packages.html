<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package Subscription — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
</head>
<body>
  <main class="ult-main" id="app"><div class="ult-muted">Loading…</div></main>
  <script type="module">
    import { mountUltimateShell, pageChrome } from './js/ultimate-shell.js';
    const session = await mountUltimateShell();
    if (!session) throw new Error('auth');
    const app = document.getElementById('app');
    app.innerHTML = pageChrome('Package Subscription', 'Menu route is live. Table and Add page will be wired on this URL — no 404.')
      + `<div class="ult-card"><p class="ult-muted">This is a reserved function page for <strong>Package Subscription</strong>. Use + Add when we attach the form (full page, not a popup).</p>
         </div>`;
  </script>
</body>
</html>
