<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fund transfer — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
</head>
<body>
  <main class="ult-main" id="app"></main>
  <script type="module">
    import { supabase, fmt } from './js/supabaseClient.js';
    import { mountUltimateShell, pageChrome } from './js/ultimate-shell.js';
    import { esc, fundTransfer, accountBalance } from './js/account-rules.js';
    await mountUltimateShell();
    const app = document.getElementById('app');
    let accounts = [];
    let txns = [];
    let err = '';

    async function load() {
      const [a, t] = await Promise.all([
        supabase.from('payment_accounts').select('*').eq('is_closed', false).order('name'),
        supabase.from('payment_account_txns').select('*').in('txn_type', ['transfer_in','transfer_out']).order('created_at', { ascending: false }).limit(80),
      ]);
      err = a.error?.message || t.error?.message || '';
      accounts = a.data || [];
      txns = t.data || [];
      render();
    }

    function opts(sel) {
      return accounts.map((a) => `<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)} (${fmt(accountBalance(a, txns))})</option>`).join('');
    }

    function render() {
      app.innerHTML = pageChrome('Fund transfer', 'Move money from one payment account to another. Writes transfer_out + transfer_in on the same date.') + `
        ${err ? `<div class="ult-alert">${esc(err)} — run sql/97_payment_accounts_stock.sql</div>` : ''}
        <div class="ult-card" style="max-width:560px;margin-bottom:16px">
          <label>From <select id="from"><option value="">—</option>${opts()}</select></label>
          <label>To <select id="to"><option value="">—</option>${opts()}</select></label>
          <label>Amount (GHS) <input id="amt" type="number" step="0.01" min="0" /></label>
          <label>Paid on <input id="paid" type="date" value="${new Date().toISOString().slice(0,10)}" /></label>
          <label>Ref / note <input id="note" placeholder="FT-…" /></label>
          <button type="button" class="ult-btn ult-btn-primary" id="go">Transfer</button>
          <a class="ult-btn ult-btn-outline" href="/payment-accounts.html">Accounts</a>
        </div>
        <div class="ult-card">
          <h3>Recent transfers</h3>
          <div class="ult-table-wrap"><table class="ult-table">
            <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead>
            <tbody>
              ${txns.map((t) => `<tr><td>${esc(t.paid_on)}</td><td>${esc(t.txn_type)}</td><td>${fmt(t.amount)}</td><td>${esc(t.note || t.ref || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="ult-muted">None yet</td></tr>'}
            </tbody>
          </table></div>
        </div>`;
      document.getElementById('go').onclick = async () => {
        try {
          await fundTransfer({
            fromId: document.getElementById('from').value,
            toId: document.getElementById('to').value,
            amount: document.getElementById('amt').value,
            paid_on: document.getElementById('paid').value,
            note: document.getElementById('note').value,
            ref: document.getElementById('note').value,
          });
          await load();
        } catch (e) { alert(e.message || e); }
      };
    }
    load();
  </script>
</body>
</html>
