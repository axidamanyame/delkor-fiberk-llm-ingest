<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS Terminal — Delkor-Fiberk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <link rel="stylesheet" href="/css/receipt.css?v=header2" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body.pos-focus { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    body.pos-focus .ult-main {
      padding: 6px 8px !important; max-width: none !important; width: 100%;
      flex: 1 1 auto; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .pos-stage {
      display: flex; gap: 0; flex: 1 1 auto; min-height: 0;
      width: 100%; height: 100%; align-items: stretch; overflow: hidden;
      flex-wrap: nowrap !important;
    }
    .pos-left, .pos-right, .pos-crm { flex: 1 1 0; min-width: 240px; min-height: 0 !important; }
    .pos-split {
      flex: 0 0 10px; cursor: col-resize; position: relative; z-index: 6; align-self: stretch;
      background: transparent; touch-action: none; user-select: none;
    }
    .pos-split::before {
      content: ''; position: absolute; left: 3px; top: 18%; bottom: 18%; width: 4px;
      border-radius: 4px; background: #cbd5e1; transition: background .12s, box-shadow .12s;
    }
    .pos-split::after {
      content: '⋮'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      color: #3d4f66; font-size: 16px; font-weight: 800; pointer-events: none; line-height: 1;
    }
    .pos-split:hover::before, .pos-split.dragging::before {
      background: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.18);
    }
    body.pos-resizing, body.pos-resizing * { cursor: col-resize !important; user-select: none !important; }
    body.pos-resizing img, body.pos-resizing iframe { pointer-events: none; }
    @media (max-width: 1280px) {
      .pos-stage { flex-wrap: nowrap !important; height: 100% !important; min-height: 0 !important; }
      .pos-left, .pos-right { flex: 1 1 0; min-width: 0; min-height: 0 !important; }
      .pos-crm { flex: 0 1 240px; min-width: 0; min-height: 0 !important; }
      .pos-split { display: none; }
    }
    @media (max-width: 900px) {
      .pos-left, .pos-right, .pos-crm { min-width: 0; }
    }
    .pos-left, .pos-right, .pos-crm { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative; }
    .pane-pop {
      height: 42px; min-width: 42px; width: auto; padding: 0 10px;
      border: 1px solid #bfdbfe; border-radius: 10px;
      background: #eff6ff; color: #1d4ed8; cursor: pointer;
      font-size: 16px; font-weight: 800; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      position: static; flex: 0 0 auto;
    }
    .pos-tools .pane-pop, .crm-tools .pane-pop {
      height: 44px; min-width: 44px; background: #fff; border: 1px solid #e2e8f0; color: #0f172a;
    }
    .pane-pop:hover { filter: brightness(1.05); background: #dbeafe; }
    .pane-scroll {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      overflow-x: scroll;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      scrollbar-width: auto;
      scrollbar-color: #3d4f66 #e2e8f0;
    }
    .pane-scroll::-webkit-scrollbar { width: 14px; height: 14px; }
    .pane-scroll::-webkit-scrollbar-thumb { background: #3d4f66; border-radius: 8px; border: 3px solid #e2e8f0; }
    .pane-scroll::-webkit-scrollbar-track { background: #e2e8f0; }
    .pane-scroll::-webkit-scrollbar-corner { background: #cbd5e1; }
    .pos-cart { flex: 1; min-width: 0; }
    .pos-cart .pos-table { min-width: 640px; width: max(100%, 640px); }
    .pos-cart thead th { position: sticky; top: 0; z-index: 2; background: #f8fafc; }
    .pos-foot { overflow: hidden; }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px; padding: 8px 10px 12px; align-content: start;
      min-width: 520px; width: max(100%, 520px); box-sizing: border-box;
    }
    .crm-body { min-width: 300px; }
    body.pos-detached .pos-split { display: none !important; }
    body.pos-detached .pos-stage { height: calc(100vh - 52px); }
    body.pos-detached[data-pane="left"] .pos-right,
    body.pos-detached[data-pane="left"] .pos-crm { display: none !important; }
    body.pos-detached[data-pane="catalog"] .pos-left,
    body.pos-detached[data-pane="catalog"] .pos-crm { display: none !important; }
    body.pos-detached[data-pane="crm"] .pos-left,
    body.pos-detached[data-pane="crm"] .pos-right { display: none !important; }
    body.pos-detached .pos-left,
    body.pos-detached .pos-right,
    body.pos-detached .pos-crm { flex: 1 1 100% !important; min-width: 0; }
    .pos-loc { display: grid; grid-template-columns: 4fr 1fr 1fr; gap: 8px; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #e2e8f0; background: linear-gradient(90deg,#0f172a,#1e3a8a); }
    .pos-loc .info-pill { width: 100%; justify-content: center; min-height: 44px; box-sizing: border-box; }
    .pos-loc .pill-repair, .pos-loc .pill-exp { gap: 6px; padding: 8px 8px; font-size: 13px; }
    .pos-loc .pill-ico { font-size: 16px; line-height: 1; }
    .pos-loc .chip { background: #1e3a8a; color: #fff; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 12px; }
    .info-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 13px; line-height: 1.2; border: 0; cursor: default; }
    .info-pill b { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; display: block; font-weight: 800; }
    .info-pill .v { font-size: 14px; }
    .pill-float { background: #bbf7d0; color: #14532d; }
    .pill-repair { background: #fed7aa; color: #9a3412; cursor: pointer; text-decoration: none; }
    .pill-exp { background: #ddd6fe; color: #5b21b6; cursor: pointer; }
    .pill-cat { background: #bfdbfe; color: #1e3a8a; }
    .pill-mgr { background: #fde68a; color: #78350f; cursor: pointer; }
    .pill-mgr.on { background: #16a34a; color: #fff; }
    .line-prod { display: flex; gap: 10px; align-items: flex-start; }
    .line-thumb { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 78px; flex: none; }
    .line-thumb img { width: 64px; height: 64px; object-fit: contain; background: #f8fafc; border-radius: 8px; }
    .line-info-btn {
      width: 100%; border: 0; background: #1e3a8a; color: #fff; font-size: 10px; font-weight: 800;
      letter-spacing: .03em; text-transform: uppercase; border-radius: 8px; padding: 5px 4px; cursor: pointer;
    }
    .line-info-btn:hover { background: #1d4ed8; }
    .pinfo { display: grid; grid-template-columns: 160px 1fr; gap: 16px; }
    .pinfo img, .pinfo .ph { width: 160px; height: 160px; object-fit: contain; background: #f8fafc; border-radius: 12px; }
    .pinfo dl { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
    .pinfo dt { color: #3d4f66; }
    .pinfo dd { margin: 0; font-weight: 600; }
    .pinfo-story { margin-top: 14px; line-height: 1.6; color: #334155; font-size: 14px; }
    .search-by { min-width: 220px; }
    .search-by p { margin: 8px 0; }
    .search-opt {
      display: flex; align-items: center; gap: 8px; width: 100%;
      border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 10px;
      background: #f8fafc; color: #334155; font-weight: 700; cursor: pointer;
    }
    .search-opt.on { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .search-opt input { accent-color: #facc15; width: 16px; height: 16px; }
    .hist-item {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      border: 1px solid #e2e8f0; background: #fff; border-radius: 8px;
      padding: 7px 10px; margin-top: 6px; cursor: pointer; text-align: left; font: inherit;
    }
    .hist-item:hover { border-color: #2563eb; background: #eff6ff; }
    .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .pin-grid button { padding: 14px 0; font-size: 18px; font-weight: 800; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; cursor: pointer; }
    .pin-grid button:hover { background: #eff6ff; }
    .pin-dots { letter-spacing: 8px; font-size: 22px; text-align: center; font-weight: 800; margin: 8px 0; }
    .pill-time { background: #c7d2fe; color: #312e81; cursor: pointer; }
    .pill-keys { background: #f5d0fe; color: #701a75; cursor: pointer; }
    .pill-keys:hover, .pill-time:hover { filter: brightness(1.05); }
    .info-pill.ico-only {
      width: 42px; height: 42px; padding: 0; justify-content: center;
      position: relative; font-size: 18px;
    }
    .keys-card {
      position: fixed; z-index: 10050;
      background: #fff; color: #0f172a;
      border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 12px 14px; min-width: 280px;
      box-shadow: 0 12px 32px rgba(15,23,42,.18);
    }
    .keys-card h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #3d4f66; }
    .keys-card .row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
    .keys-card kbd {
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 800;
      background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px;
      padding: 4px 6px; text-align: center; color: #1e3a8a;
    }
    .keys-card span { font-size: 13px; font-weight: 600; }
    .pos-toolbar { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; align-items: stretch; }
    .pos-toolbar .t-cluster {
      display: grid;
      grid-template-columns: minmax(0,1fr) 42px;
      gap: 6px;
      align-items: stretch;
    }
    .pos-toolbar .t-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .pos-toolbar .t-row { display: grid; grid-template-columns: 42px minmax(0,1fr) 42px; gap: 6px; align-items: center; }
    .pos-toolbar .t-side { display: flex; flex-direction: column; gap: 6px; width: 42px; }
    .pos-toolbar .t-side .pane-pop,
    .pos-toolbar .t-side .ico {
      width: 42px; height: 42px; min-width: 42px; flex: 0 0 42px; padding: 0;
    }
    .pos-toolbar .t-row select, .pos-toolbar .t-row input[type=search] {
      height: 42px; width: 100%; border: 1px solid #93c5fd; border-radius: 10px;
      padding: 0 12px; font: inherit; background: #fff; box-sizing: border-box;
    }
    .pos-toolbar .cust-wrap { display:flex; align-items:center; border:1px solid #e2e8f0; border-radius:10px; overflow:hidden; flex:0 1 240px; height:42px; background:#fff; }
    .pos-toolbar .cust-wrap button.cust-face { border:0; background:#eff6ff; color:#1d4ed8; height:42px; width:42px; cursor:pointer; font-size:18px; }
    .pos-toolbar .cust-wrap select { border:0; height:42px; flex:1; min-width:0; background:transparent; font:inherit; }
    .pos-toolbar .search-wrap { display:flex; align-items:center; flex:1; min-width:0; border:1px solid #93c5fd; border-radius:10px; height:42px; background:#fff; }
    .pos-toolbar .search-wrap input { border:0; flex:1; min-width:0; height:42px; padding:0 8px; font:inherit; outline:none; }
    .scan-wrap { position: relative; min-width: 0; }
    .scan-wrap input { width: 100%; height: 42px; border: 1px solid #93c5fd; border-radius: 10px; padding: 0 12px; font: inherit; box-sizing: border-box; }
    #scan-hits {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      background: #fff; border: 1px solid #93c5fd; border-radius: 12px;
      box-shadow: 0 16px 40px rgba(15,23,42,.2); z-index: 90;
      max-height: 320px; overflow: auto; color: #0f172a;
    }
    #scan-hits .scan-hit {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      width: 100%; text-align: left; border: 0; background: #fff; cursor: pointer;
      padding: 10px 12px; font: inherit; border-bottom: 1px solid #f1f5f9;
    }
    #scan-hits .scan-hit:hover, #scan-hits .scan-hit.on { background: #eff6ff; }
    #scan-hits .scan-hit b { display: block; font-size: 13px; }
    #scan-hits .scan-hit .meta { color: #3d4f66; font-size: 12px; white-space: nowrap; }
    #scan-hits .scan-miss { padding: 12px; color: #3d4f66; font-size: 13px; }
    .pos-toolbar .ico {
      width: 42px; height: 42px; border: 1px solid #bfdbfe; background: #2563eb; color: #fff;
      border-radius: 10px; cursor: pointer; font-weight: 800; flex:0 0 42px;
    }
    .pos-toolbar .ico.ghost { background:#eff6ff; color:#2563eb; }
    .pos-pop {
      position: absolute; z-index: 30; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 12px; box-shadow: 0 12px 40px rgba(15,23,42,.18); padding: 16px; min-width: 280px;
    }
    .pos-toolbar select, .pos-toolbar input { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; font-size: 13px; }
    .pos-toolbar input[type=search] { flex: 1; min-width: 160px; }
    .pos-cart { flex: 1; min-width: 0; overflow-x: scroll; overflow-y: scroll; }
    .pos-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pos-table th { position: sticky; top: 0; background: #f8fafc; padding: 8px; text-align: left; font-size: 11px; text-transform: uppercase; color: #3d4f66; }
    .pos-table td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .qty-step { display: inline-flex; align-items: center; gap: 0; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .qty-step button { width: 28px; height: 28px; border: none; background: #f1f5f9; cursor: pointer; font-weight: 700; }
    .qty-step input { width: 52px; border: none; text-align: center; font: inherit; }
    .pos-sum { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 0; background: transparent; border: 0; font-size: 12px; }
    .pos-sum .sum-card { border-radius: 12px; padding: 12px 8px 10px; min-height: 72px; text-align: center; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
    .pos-sum .lbl { font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; opacity: .9; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
    .pos-sum .val { font-weight: 800; font-size: 16px; margin-top: 6px; text-align: center; word-break: break-word; line-height: 1.2; }
    .pos-sum .sum-sub { background: #e2e8f0; color: #0f172a; }
    .pos-sum .sum-disc { background: #fee2e2; color: #b91c1c; }
    .pos-sum .sum-tax { background: #fef3c7; color: #92400e; }
    .pos-sum .sum-ship { background: #ede9fe; color: #5b21b6; }
    .pos-sum .ico-btn { border: 0; background: rgba(255,255,255,.75); border-radius: 8px; width: 28px; height: 28px; font-size: 16px; font-weight: 800; cursor: pointer; line-height: 1; }
    .pos-foot { display: none; }
    .pos-checkout-bar {
      display: grid; grid-template-columns: 48px minmax(0,1fr) minmax(0,1.8fr) auto; gap: 8px; align-items: stretch;
      padding: 8px 10px; border-top: 1px solid #e2e8f0; background: #fff; flex: 0 0 auto;
    }
    .pos-checkout-bar .co-recv {
      min-width: 48px; border: 0; border-radius: 12px; background: #1d4ed8; color: #fff;
      font-size: 20px; font-weight: 800; cursor: pointer; font: inherit;
    }

      font-weight: 800; color: #1e40af; background: #dbeafe; border: 0; border-radius: 12px;
      padding: 10px 12px; text-align: center; cursor: pointer; font: inherit; min-height: 44px;
    }
    .pos-checkout-bar .co-total {
      display: flex; align-items: center; justify-content: center;

      background: #16a34a; color: #fff; border: 0; border-radius: 12px;
      font-weight: 800; padding: 12px 18px; min-height: 44px; cursor: pointer; font: inherit;
    }
    .pay-scrim {
      position: absolute; inset: 0; z-index: 11; border: 0;
      background: rgba(15,23,42,.32); cursor: pointer;
    }
    .pos-left.pay-open .pos-foot {
      display: grid;
      grid-template-columns: minmax(0,1fr) 210px;
      gap: 8px; padding: 8px;
      position: absolute; left: 8px; right: 8px; bottom: 64px;
      z-index: 12; border: 1px solid #e2e8f0; border-radius: 16px;
      background: #f8fafc;
      box-shadow: 0 18px 44px rgba(15,23,42,.24);
    }
    .pos-left.pay-open .pos-checkout-bar { display: grid; }

    html.ult-phone .pay-scrim { display: none !important; }
    html.ult-phone .pos-left.pay-open .pos-checkout-bar { display: none; }
    .pos-foot-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .pos-pay-col { display: flex; flex-direction: column; gap: 8px; }

      width: 100%; min-height: 44px; font-weight: 800; font-size: 14px; border-radius: 12px; cursor: pointer; font-family: inherit;
    }
    .pos-pay-col .btn-items { background: #dbeafe; color: #1e40af; border: 0; }

      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; min-height: 110px; padding: 16px 10px; border-radius: 14px;
      background: #fff; color: #0f766e; border: 2px solid #14b8a6;

    .pos-pay-col .sum-pay .val { font-size: 26px; margin-top: 8px; letter-spacing: .02em; color: #0f766e; font-weight: 800; text-transform: uppercase; }
    .crm-tools {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.4fr) 44px;
      gap: 8px; padding: 8px; background: #0f172a; align-items: stretch;
      min-width: 0;
    }
    .crm-tools .info-pill {
      width: 100%; justify-content: center; min-height: 40px; min-width: 0;
      box-sizing: border-box; cursor: pointer; overflow: hidden;
      flex-direction: column;
    }

    .crm-tools .pane-pop { width: 44px; min-width: 44px; max-width: 44px; justify-self: stretch; }
    .pill-mgr input { margin: 0; accent-color: #15803d; cursor: pointer; width: 16px; height: 16px; flex: none; }

      flex-direction: row;

    .pos-bar { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 0; border: 0; align-items: stretch; }
    .pos-bar button { border: none; border-radius: 10px; padding: 12px 8px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; width: 100%; min-height: 44px; }
    .btn-cancel { background: #fff; color: #dc2626; border: 1px solid #fecaca !important; }
    .btn-ghost { background: #f8fafc; color: #334155; }
    .btn-multi { background: #0f172a; color: #fff; }
    .btn-quote { background: #e0e7ff; color: #3730a3; }
    .btn-credit { background: #ffedd5; color: #9a3412; }
    .btn-card { background: #e0f2fe; color: #075985; }
    .btn-hold { background: #f1f5f9; color: #334155; }
    .btn-cash { background: #16a34a; color: #fff; }
    .hold-card { width: min(520px, 96vw) !important; }
    .hold-sum { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; margin:8px 0 14px; }

    .hold-sum span { font-weight:700; color:#0f172a; }

    if (!session) throw new Error('auth');
    let bizSet = {};

      bizSet = await Promise.race([

      ]);
    } catch { bizSet = {}; }
    const tillOff = (key) => settingOn(bizSet, key, false);

      for (let i = localStorage.length - 1; i >= 0; i--) {

        const val = localStorage.getItem(k) || '';
        if (val.length > 8000 || k !== 'dfk-till-display:' + sessionId) localStorage.removeItem(k);
      }
    } catch { /* ignore */ }
    let till = null;
    {
      let tillRow = null;
      let tillErr = null;

        const q = await Promise.race([
          supabase.from('pos_sessions').select('*').eq('id', sessionId).maybeSingle(),
          new Promise((resolve) => setTimeout(() => resolve({ data: null, error: { message: 'timeout' } }), 4000)),
        ]);
        tillRow = q.data;
        tillErr = q.error;
      } catch (e) { tillErr = e; }
      till = tillRow;
      if (tillErr || !till || till.status !== 'open') {
        try { till = JSON.parse(sessionStorage.getItem('df_pos_session_' + sessionId) || 'null'); } catch (_) { till = null; }
      }
      if (!till || till.status !== 'open') { location.href = '/till-login.html'; throw new Error('register'); }
      applyTillPair(till);
      try { sessionStorage.setItem('df_pos_session_' + sessionId, JSON.stringify(till)); } catch (_) {}
      saveActiveLocation(till.location_code);
      try {
        const hit = SUBSIDIARIES.find((s) => s.code === till.subsidiary_code);
        if (hit) await saveActiveSubsidiary(session.user.id, hit);
      } catch (_) {}
      try {
        let patch = {
          subsidiary_code: till.subsidiary_code,
          location_code: till.location_code,
          location_name: till.location_name,
        };
        let { error: sessErr } = await supabase.from('pos_sessions').update(patch).eq('id', sessionId);
        if (sessErr && /column|schema cache|could not find/i.test(sessErr.message || '')) {
          delete patch.location_name;
          ({ error: sessErr } = await supabase.from('pos_sessions').update(patch).eq('id', sessionId));
        }
        if (sessErr) {
          await supabase.from('pos_sessions').update({ status: till.status || 'open' }).eq('id', sessionId);
        }
      } catch (_) {}
    }

      myRoleEarly = pr?.role || '';

    } catch (_) {}
    const mine = String(till.cashier_id || '') === String(session.user.id);
    if (!mine) {

      return {
        date: dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
        time: dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
      };

    function tillElapsed(opened) {
      const start = opened instanceof Date ? opened : new Date(opened);

      let sec = Math.max(0, Math.floor((Date.now() - start.getTime()) / 1000));
      const h = Math.floor(sec / 3600);
      sec -= h * 3600;
      const m = Math.floor(sec / 60);
      const s = sec - m * 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (h >= 1) return `${h}h ${pad(m)}m ${pad(s)}s`;
      if (m >= 1) return `${m}m ${pad(s)}s`;
      return `${s}s`;
    }

    function bindPosSplitters() {
      if (window.matchMedia('(max-width: 1280px)').matches) return;
      applyPaneWidths(loadPaneWidths());
      document.querySelectorAll('.pos-split').forEach((h) => {
        h.onpointerdown = (e) => {
          if (e.button) return;
          e.preventDefault();
          const idx = Number(h.dataset.split);
          const panes = ['.pos-left', '.pos-right', '.pos-crm'].map((s) => document.querySelector(s));
          const startX = e.clientX;
          const start = panes.map((p) => p.getBoundingClientRect().width);
          const total = start.reduce((a, b) => a + b, 0) || 1;
          h.classList.add('dragging');
          document.body.classList.add('pos-resizing');
          try { h.setPointerCapture(e.pointerId); } catch { /* ignore */ }
          const move = (ev) => {
            const dx = ev.clientX - startX;
            let a = start[idx] + dx;
            let b = start[idx + 1] - dx;
            const min = Math.min(240, total * 0.18);
            if (a < min) { b -= (min - a); a = min; }
            if (b < min) { a -= (min - b); b = min; }
            if (a < min || b < min) return;
            const w = start.slice();
            w[idx] = a; w[idx + 1] = b;
            applyPaneWidths(w.map((x) => (x / total) * 100));
          };
          const up = () => {
            h.classList.remove('dragging');
            document.body.classList.remove('pos-resizing');
            h.onpointermove = null;
            h.onpointerup = null;
            h.onpointercancel = null;
            const widths = panes.map((p) => p.getBoundingClientRect().width);
            const t = widths.reduce((a, b) => a + b, 0) || 1;
            try { localStorage.setItem(PANE_KEY, JSON.stringify(widths.map((x) => +(x / t * 100).toFixed(2)))); } catch { /* ignore */ }
          };
          h.onpointermove = move;
          h.onpointerup = up;
          h.onpointercancel = up;
        };
        h.ondblclick = () => {
          try { localStorage.removeItem(PANE_KEY); } catch { /* ignore */ }
          applyPaneWidths([33.33, 33.33, 33.34]);
        };
      });
    }

        ? taxable * (taxPct / 100)

      const ship = Number(shipping.charge || 0);
      return { items: cart.reduce((a, L) => a + (Number(L.qty) || 0), 0), subtotal, disc, tax, ship, total: taxable + tax + ship };

    async function suspendCart() {
      if (!cart.length) return showNotice('Cart is empty', 'Add items before suspending.');
      const ref = holdRef();
      const payload = {
        session_id: sessionId,
        cashier_id: session.user.id,
        subsidiary_code: currentScope().sub || operatingCode(sub),
        location_code: currentScope().locCode || till.location_code || null,
        customer_name: holdCustomer(),
        hold_no: ref,
        reason: window._susReason || HOLD_REASONS[0],
        notes: window._susNote || '',
        cart,
        item_count: totals().items,
        total_amount: totals().total,
      };
      let { error } = await supabase.from('pos_holds').insert(payload);
      if (error) {
        const peel = ['hold_no', 'reason', 'notes', 'item_count', 'location_code', 'cashier_id', 'subsidiary_code'];
        for (const k of peel) {
          delete payload[k];
          const r2 = await supabase.from('pos_holds').insert(payload);
          if (!r2.error) { error = null; break; }
          error = r2.error;
        }
      }
      if (error) return showNotice('Could not suspend', error.message + ' — parked tickets need the pos_holds table.');
      cart = [];
      window._susNote = '';
      pop = null;
      await loadMeta();
      showNotice('Ticket parked', ref + ' · recall it from Suspended sales. Stock was not moved.');
    }

      await supabase.from('pos_holds').delete().eq('id', id);
      await loadMeta();
      render();

      const t = totals();
      const state = {
        session: sessionId,
        customer: cust,
        cashierName: till.cashier_email || session.user?.email || '',
        lines: cart.map((L) => ({ name: L.name, sku: L.sku, qty: L.qty, price: L.price })),

        paying: t.total, change: 0, balance: 0, location: till.location_name || '',
      };
      if (lastSale && pop === 'receipt') {
        const s = lastSale;
        state.receipt = {
          receipt_code: s.receipt_code,
          receipt_url: s.receipt_url || (s.receipt_code ? (location.origin + '/r/' + s.receipt_code) : ''),
          reference: s.reference,
          transaction_date: s.at,
          at: s.at,
          customer_name: s.customer,
          customer_phone: s.phone,
          payment_method: s.payLabel,
          items: s.lines || [],
          lines: s.lines || [],
          gross_total: s.subtotal,
          tax_amount: s.tax,
          tax_label: s.taxLabel || '',
          discount: s.discount || 0,
          grand_total: s.total,
          shop_city: 'Accra',
          shop_phone: '054 644 3323',
          shop_email: 'social.delkorfiberk@gmail.com',
          tin: 'C0001234567',
          location_name: s.location,
          subsidiary_code: s.subsidiary_code || till?.subsidiary_code || '',
        };
      }
      const key = 'dfk-till-display:' + sessionId;
      try {
        localStorage.setItem(key, JSON.stringify(state));
      } catch {
        try {
          const drop = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && (k.startsWith('dfk-till-display:') || k.startsWith('df_pos_live_'))) drop.push(k);
          }
          drop.forEach((k) => { try { localStorage.removeItem(k); } catch { /* ignore */ } });
          localStorage.setItem(key, JSON.stringify(state));
        } catch { /* phone storage full — customer screen still gets BroadcastChannel / supabase */ }
      }
      try { new BroadcastChannel('dfk-till').postMessage(state); } catch (_) {}
    }

      const { data: salesRaw } = await salesQ;
      let sales = (salesRaw || []).filter((r) => {
        if (isDemoRecord(r)) return false;

        return false;

      const refunds = sales.filter((r) => /return|refund/i.test(r.status || ''));
      const due = sales.filter((r) => /due|partial|credit/i.test(r.payment_status || r.status || ''));
      const sum = (rows) => rows.reduce((a, r) => a + Number(r.total_amount || 0), 0);

            <tr><td>Cash Payment:</td><td>${fmt(collected)}</td><td>${fmt(dueAmt)}</td><td>${fmt(expAmt)}</td></tr>
            <tr><td><strong>Total</strong></td><td class="reg-green">${fmt(collected)}</td><td>${fmt(dueAmt)}</td><td style="background:#fee2e2">${fmt(expAmt)}</td></tr>

            <tr class="reg-green"><td colspan="3">Grand Total</td><td>${skuQty}</td><td>${fmt(skuAmt || cashSales)}</td></tr>

          <thead><tr><th>#</th><th>Brands</th><th>Quantity</th><th>Total amount</th></tr></thead>
          <tbody>
            ${brandRows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.brand}</td><td>${r.qty}</td><td>${fmt(r.amt)}</td></tr>`).join('') || '<tr><td colspan="4">No brand breakdown yet</td></tr>'}
            <tr class="reg-green"><td colspan="2">Grand Total</td><td>${brQty}</td><td>${fmt(brAmt || cashSales)}</td></tr>

      lastRegSnap = {
        session_id: sessionId,

        email,

        opening_float: openAmt,

    function addProduct(id) {

      if (!p) return;

    function htmlEsc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }
    function productHits(q) {
      const low = String(q || '').toLowerCase().trim();
      const pool = (products || []).filter(productOnRegister);
      if (!low) return [];
      const scored = [];
      for (const p of pool) {
        const name = String(p.name || '').toLowerCase();
        const sku = String(p.sku || '').toLowerCase();
        const bar = String(p.barcode || '').toLowerCase();
        let score = 0;
        if (searchBySku && (sku === low || bar === low)) score = 400;
        else if (searchBySku && (sku.startsWith(low) || bar.startsWith(low))) score = 300;
        else if (searchByName && name.startsWith(low)) score = 250;
        else if (searchByName && name.split(/\s+/).some((w) => w.startsWith(low))) score = 180;
        else if (searchByName && name.includes(low)) score = 120;
        else if (searchBySku && (sku.includes(low) || bar.includes(low))) score = 100;
        else continue;
        scored.push({ p, score });
      }
      scored.sort((a, b) => b.score - a.score || String(a.p.name).localeCompare(String(b.p.name)));
      return scored.map((x) => x.p);
    }
    function filterTiles(q) {
      const low = String(q || '').toLowerCase().trim();
      const hits = low ? new Set(productHits(low).map((p) => String(p.id))) : null;
      document.querySelectorAll('.prod-tile').forEach((el) => {
        el.style.display = (!hits || hits.has(String(el.dataset.id))) ? '' : 'none';
      });
    }
    function paintScanHits(scan) {
      const box = document.getElementById('scan-hits');
      if (!scan || !box) return;
      const q = scan.value.trim();
      filterQ = q;
      filterTiles(q);
      if (!q) { box.innerHTML = ''; box.hidden = true; return; }
      const hits = productHits(q).slice(0, 10);
      box.hidden = false;
      if (!hits.length) {
        box.innerHTML = `<div class="scan-miss">No product matching “${htmlEsc(q)}”</div>`;
        return;
      }
      box.innerHTML = hits.map((p, i) => `
        <button type="button" class="scan-hit ${i===0?'on':''}" data-id="${htmlEsc(p.id)}">
          <span><b>${htmlEsc(p.name)}</b><span class="meta">${htmlEsc(p.sku || p.barcode || '')}</span></span>
          <span class="meta">${fmt(p.selling_price)}</span>
        </button>`).join('');
      box.querySelectorAll('.scan-hit').forEach((b) => {
        b.onmousedown = (e) => { e.preventDefault(); pickScanProduct(b.dataset.id, scan); };
      });
    }
    function pickScanProduct(id, scan) {
      if (!id) return;
      if (scan) { scan.value = ''; filterQ = ''; }
      const box = document.getElementById('scan-hits');
      if (box) { box.innerHTML = ''; box.hidden = true; }
      addProduct(id);
    }
    function bindScanSearch(scan) {
      if (!scan || scan.dataset.scanOn === '1') return;
      scan.dataset.scanOn = '1';
      let idx = 0;
      scan.addEventListener('input', () => { idx = 0; paintScanHits(scan); });
      scan.addEventListener('focus', () => paintScanHits(scan));
      scan.addEventListener('keydown', (e) => {
        const box = document.getElementById('scan-hits');
        const buttons = [...(box?.querySelectorAll('.scan-hit') || [])];
        if (e.key === 'ArrowDown' && buttons.length) {
          e.preventDefault();
          idx = Math.min(buttons.length - 1, idx + 1);
          buttons.forEach((b, i) => b.classList.toggle('on', i === idx));
          return;
        }
        if (e.key === 'ArrowUp' && buttons.length) {
          e.preventDefault();
          idx = Math.max(0, idx - 1);
          buttons.forEach((b, i) => b.classList.toggle('on', i === idx));
          return;
        }
        if (e.key === 'Escape') {
          const box = document.getElementById('scan-hits');
          if (box) { box.hidden = true; box.innerHTML = ''; }
          return;
        }
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const q = scan.value.trim();
        const chosen = buttons[idx]?.dataset.id || productHits(q)[0]?.id;
        if (chosen) pickScanProduct(chosen, scan);
        else addByQuery(q);
      });
      if (scan.value.trim()) paintScanHits(scan);
    }

    function addByQuery(q) {
      if (!q) return;
      const low = q.toLowerCase();
      const hit = products.find((p) => {
        if (searchBySku && ((p.barcode && p.barcode === q) || (p.sku && p.sku.toLowerCase() === low))) return true;
        if (searchByName && p.name && p.name.toLowerCase().includes(low)) return true;
        return false;
      });
      if (!hit) { showNotice('Not found', 'No product matches "' + q + '".', 'warn'); return; }
      addProduct(hit.id);
    }

    /* ESC/POS receipt for a paired Web Serial printer. 32 columns, which is
       standard for 58mm thermal paper. No drawer kick — printing only. */
    const W = 32;
    const padLine = (left, right) => {
      const l = String(left ?? '');
      const r = String(right ?? '');
      const gap = Math.max(1, W - l.length - r.length);
      return (l + ' '.repeat(gap) + r).slice(0, W);
    };
    function escPosLines(sale) {
      const out = [
        'Delkor-Fiberk',
        sale.location || '',
        sale.banner || '',
        '-'.repeat(W),
        padLine(sale.reference || '', sale.at || ''),
        padLine('Cashier', (sale.cashier || '').split('@')[0]),
        padLine('Customer', sale.customer || ''),
        '-'.repeat(W),
      ];
      (sale.lines || []).forEach((L) => {
        out.push(String(L.name || '').slice(0, W));
        out.push(padLine(`  ${L.qty} x ${fmt(L.price)}`, fmt(Number(L.qty) * Number(L.price))));
      });
      out.push('-'.repeat(W));
      out.push(padLine('Subtotal', fmt(sale.subtotal)));
      if (sale.tax) out.push(padLine(sale.taxLabel || 'Tax', fmt(sale.tax)));
      out.push(padLine('TOTAL', fmt(sale.total)));
      out.push(padLine('Paid', sale.payLabel || ''));
      if (sale.change != null) out.push(padLine('Change', fmt(sale.change)));
      if (sale.due) out.push(padLine('Amount due', fmt(sale.due)));
      out.push('-'.repeat(W));
      if (sale.receipt_url) out.push(String(sale.receipt_url).slice(0, W));
      out.push('Thank you');
      return out;
    }

    async function printTillThermal(sale, { pairIfNeeded = false } = {}) {
      if (!sale) return false;
      let sent = await printEscPos(escPosLines(sale));
      if (!sent && pairIfNeeded) {
        const res = await connectPrinter();
        if (!res.ok) { showNotice('No printer', res.message, 'warn'); return false; }
        sent = await printEscPos(escPosLines(sale));
      }
      return sent;
    }

    async function checkout(status, tenders) {
      if (!cart.length) return showNotice('Cart is empty', 'Add an item before taking payment.', 'warn');
      for (const L of cart) {
        const p = products.find(x => x.id === L.id) || {};
        L.qty = snapQty(p, L.qty);
      }
      const opCode = currentScope().sub || operatingCode(sub);
      const t = totals();
      const resolved = await resolveCustomer();
      const custId = resolved.contact_id || resolved.id;
      const custName = resolved.name;
      if (status === 'credit' && !custId && custName === 'Walk-In Customer') {
        return showNotice('Customer required', 'Credit sale needs a named customer on file.');
      }
      const reference = 'SO-' + new Date().toISOString().slice(2, 10).replace(/-/g, '') + '-' + String(Date.now()).slice(-4);

      const payload = {
        reference,
        customer_name: custName,
        status: status === 'draft' ? 'draft' : (status === 'quotation' ? 'quotation' : 'completed'),
        payment_status: (status === 'draft' || status === 'quotation' || status === 'credit') ? 'unpaid' : 'paid',
        order_date: new Date().toISOString().slice(0, 10),
        subtotal: t.subtotal,
        tax_amount: t.tax,
        total_amount: t.total,
        notes: 'POS · ' + opCode + ' · agent ' + session.user.email + ' · ' + (tenders?.length ? 'split' : status) + (shipping.details ? ' · ship '+shipping.details : '') + ' |LINES|' + JSON.stringify(cart.map((L) => ({ id: L.id, sku: L.sku, name: L.name, qty: L.qty, price: L.price }))),
        subsidiary_code: opCode,
        payment_method: tenders?.length > 1 ? 'split' : (tenders?.[0]?.method || 'cash'),
        pos_session_id: sessionId,
        sale_channel: 'pos',
        location_id: (typeof locUuid==='function' ? locUuid(locationId) : null),
        location_name: till.location_name || (locations.find((l) => String(l.id) === String(locationId)) || {}).name || (locations.find((l) => l.code === locationId) || {}).name || null,
      };
      if (custId && isUuid(custId)) payload.customer_id = custId;
      const agent = currentAgent();
      if (agent) {
        payload.commission_agent_id = isUuid(agent.id) ? agent.id : null;
        payload.commission_agent_name = agent.full_name || null;
        payload.commission_agent_email = agent.email || null;
        payload.commission_percent = Number(agent.commission_percent) || 0;
        payload.cmsn_calculation_type = cmsnCfg.calc || 'invoice';
        payload.notes = (payload.notes || '') + ' · agent ' + (agent.full_name || agent.email || agent.id);
      }
      if (locationSupportsAgents(getActiveLocation())) {
        payload.location_code = getActiveLocation();
        if (getActiveAgent()) payload.agent_id = getActiveAgent();
      }

      let so = null;
      let error = null;
      const statusTries = status === 'quotation'
        ? ['quotation', 'draft', 'completed']
        : status === 'credit'
          ? ['completed', 'final', 'pending']
          : status === 'draft'
            ? ['draft', 'pending', 'completed']
            : ['completed', 'final', 'pending'];
      for (const st of statusTries) {
        payload.status = st;
        ({ data: so, error } = await supabase.from('sales_orders').insert(payload).select('id').single());
        if (!error && so) break;
        if (error && /customer_id/i.test(error.message)) {
          delete payload.customer_id;
          continue;
        }
        if (error && !/status/i.test(error.message)) break;
      }
      if (error) {
        const peel = ['customer_id', 'location_id', 'sale_channel', 'pos_session_id', 'payment_method', 'tax_amount', 'subsidiary_code', 'payment_status', 'notes', 'commission_agent_id', 'commission_agent_name', 'commission_agent_email', 'commission_percent', 'cmsn_calculation_type'];
        for (const k of peel) {
          delete payload[k];
          const r2 = await supabase.from('sales_orders').insert(payload).select('id').single();
          if (!r2.error) { so = r2.data; error = null; break; }
          error = r2.error;
        }
      }
      if (error || !so) return showNotice('Could not save sale', error?.message || 'Try again.');

      for (const L of cart) {
        const row = {
          sales_order_id: so.id,
          product_id: L.id,
          product_name: L.name,
          quantity: Number(L.qty),
          unit_price: Number(L.price),
          sku: L.sku || null,
        };
        let { error: le } = await supabase.from('sales_order_lines').insert(row);
        if (le) {
          delete row.sku;
          const r2 = await supabase.from('sales_order_lines').insert(row);
          if (r2.error) console.warn('line', r2.error.message);
        }
      }

      if (tenders?.length) {
        for (const td of tenders) {
          await supabase.from('pos_tenders').insert({
            sales_order_id: so.id,
            method: td.method,
            amount: td.amount,
            gateway: td.method,
            msisdn: td.msisdn || null,
          });
        }
      }
      if (status !== 'draft' && status !== 'quotation') {
        try { await supabase.rpc('post_sale_to_ledger', { p_so_id: so.id }); } catch (_) {}
        for (const L of cart) {
          const qty = Number(L.qty) || 0;
          await mutateStock(L.id, -qty, { reference, name: L.name, sku: L.sku, notes: 'POS sale' });
        }
      }
      await writeAudit({
        action: status === 'draft' ? 'POS_DRAFT' : 'POS_FINALIZE',
        entity_type: 'sales_order',
        entity_id: so.id,
        subsidiary_code: opCode,
        summary: (status === 'draft' ? 'Draft ' : 'Finalized ') + reference,
        payload: { reference, total_amount: t.total, status },
      });
      if (status !== 'draft' && status !== 'quotation' && resolved.id) {
        const custRow = crmBundle.customer || customers.find((x) => String(x.id) === String(resolved.id)) || { id: resolved.id, name: custName };
        if (!isWalkIn(custRow)) {
          if (status !== 'credit') {
            try { await earnLoyalty(custRow, { total: t.total, saleId: so.id, saleRef: reference, actor: session.user.email }); } catch (_) {}
          }
        }
      }
      try {
        const { postSaleDocument } = await import('./js/ops.js');
        await postSaleDocument({
          reference, customer: payload.customer_name, total: t.total, tax: t.tax, subtotal: t.subtotal,
          paid: status === 'credit' || status === 'draft' || status === 'quotation' ? 0 : t.total,
          status, lines: cart,
        });
      } catch (e) { console.warn('ops post', e); }
      const banner = status === 'draft' ? 'DRAFT SAVED — not a sale'
        : status === 'quotation' ? 'QUOTATION — stock not moved'
        : status === 'credit' ? 'CREDIT SALE — amount due'
        : 'PAYMENT RECEIVED';
      const payLabel = status === 'credit' ? 'On account (unpaid)'
        : status === 'draft' ? 'Draft — no payment'
        : status === 'quotation' ? 'Quote — no payment'
        : (tenders?.[0]?.method || 'cash').toUpperCase();
      lastSale = {
        kind: status === 'credit' ? 'credit' : (status === 'completed' ? 'completed' : 'hold'),
        banner,
        reference,
        location: currentScope().locName || opCode,
        cashier: session.user.email,
        at: new Date().toLocaleString('en-GB'),
        customer: payload.customer_name,
        phone: (crmBundle.customer || customers.find((x) => String(x.id) === String(resolved.id)) || {}).phone
          || (tenders || []).find((td) => td.msisdn)?.msisdn || '',
        email: (crmBundle.customer || customers.find((x) => String(x.id) === String(resolved.id)) || {}).email || '',
        lines: cart.map((L) => ({ ...L })),
        subtotal: t.subtotal,
        tax: t.tax,
        total: t.total,
        tenders: tenders || [],
        change: tenders?.[0]?.change ?? null,
        due: status === 'credit' || status === 'draft' || status === 'quotation' ? t.total : 0,
        payLabel,
        taxLabel: taxPct ? taxLabel : '',
        subsidiary_code: till?.subsidiary_code || opCode || '',
      };
      if (status !== 'draft' && status !== 'quotation') {
        try {
          const { createReceipt } = await import('./js/bank-book.js');
          const rec = await createReceipt({
            reference,
            customer_name: lastSale.customer,
            customer_phone: lastSale.phone,
            customer_email: lastSale.email,
            items: lastSale.lines,
            payment_method: lastSale.payLabel,
            discount: 0,
            tax_amount: lastSale.tax,
            tax_label: taxPct ? taxLabel : '',
            grand_total: lastSale.total,
            gross_total: lastSale.subtotal,
            location_name: lastSale.location,
            shop_name: 'Delkor-Fiberk',
            shop_tag: lastSale.location,
            shop_city: 'Accra',
            shop_email: 'social.delkorfiberk@gmail.com',
            subsidiary_code: lastSale.subsidiary_code,
          });
          lastSale.receipt_code = rec.receipt_code;
          lastSale.receipt_url = rec.receipt_url;
        } catch (e) { console.warn('digital receipt', e); }
      }
      if (status !== 'draft' && status !== 'quotation') {
        /* Silent no-op when no printer is paired — the on-screen receipt and
           the Paper button remain the fallback. */
        try { await printTillThermal(lastSale); } catch (e) { console.warn('thermal', e); }
      }
      cart = [];
      pop = 'receipt';
      await loadMeta();
      render();
      paintStock();
    }

    function paintStock() {
      document.querySelectorAll('.prod-tile').forEach((el) => {
        const p = products.find((x) => String(x.id) === String(el.dataset.id));
        const stk = el.querySelector('.stk');
        if (stk && p) stk.textContent = stockLine(p);
        el.style.opacity = '1';
      });
    }
    async function refreshStock() {
      const alt = await supabase.from('product_stock').select('product_id, warehouse_code, quantity').limit(4000);
      stockRows = alt.data || stockRows;
      rebuildStockMap();
      paintStock();
    }
    try {
      supabase
        .channel('pos-stock-' + sessionId)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'product_stock' }, () => {
          refreshStock();
        })
        .subscribe();
    } catch (e) { console.warn(e); }

    try { await loadLocations(); } catch (e) { console.warn(e); }
    function safeRender(errPrefix) {
      try { render(); }
      catch (e) {
        const el = document.getElementById('app');
        if (el) el.innerHTML = '<div class="ult-alert">' + (errPrefix || 'POS render') + ': ' + (e.message || e) + '</div>';
        console.error(e);
      }
    }
    safeRender('POS first paint');
    try {
      await Promise.race([
        loadMeta(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('catalog timeout')), 6000)),
      ]);
    } catch (e) { console.warn(e); }
    try {
      const saved = JSON.parse(localStorage.getItem(LIVE_KEY) || 'null');
      if (saved && Array.isArray(saved.cart) && saved.src !== WIN_ID) {
        cart = saved.cart;
        selectedCustId = saved.selectedCustId || selectedCustId;
        orderDiscount = saved.orderDiscount || orderDiscount;
        shipping = saved.shipping || shipping;
        taxPct = saved.taxPct ?? taxPct;
        lastLiveTs = saved.ts || 0;
        if (selectedCustId) {
          try { crmBundle = await loadCustomer360(selectedCustId); } catch (_) {}
        }
      }
    } catch (_) {}
    try { safeRender('POS render'); } catch (e) {
      document.getElementById('app').innerHTML = '<div class="ult-alert">POS render: ' + (e.message||e) + '</div>';
    }
    try { paintStock(); } catch (e) { console.warn(e); }
  </script>
</body>
</html>
