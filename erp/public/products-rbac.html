<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — RBAC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #f1f5f9; margin: 0; }
    .wrap { padding: 20px 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #64748b; font-size: 13px; margin: 0 0 14px; }
    .card { background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; background: #f8fafc; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #64748b; }
    td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
    .btn { padding: 8px 14px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .toolbar { display: flex; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 11px; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 999px; }
    .muted { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Products</h1>
    <p class="sub">RBAC demo — cost column hidden without <code>product.view_purchase_price</code></p>
    <div class="toolbar">
      <span class="badge" id="roleBadge">…</span>
      <button type="button" class="btn btn-primary" id="btnAdd" data-perm="product.add" style="display:none">+ Add Product</button>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Selling</th>
            <th data-perm="product.view_purchase_price">Cost (purchase)</th>
            <th data-perm="product.edit">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
  <script type="module">
    import { supabase, loadAccess, can, applyDomPermissions, mountShellRBAC } from './js/shell-rbac.js';

    const ctx = await mountShellRBAC();
    if (!ctx) throw new Error('auth');

    if (!can('product.view')) {
      alert('No product.view permission');
      location.href = '/dashboard.html';
    }

    document.getElementById('roleBadge').textContent = ctx.roleName + (ctx.isAdmin ? ' (admin)' : '');
    applyDomPermissions(document);

    const showCost = can('product.view_purchase_price');
    const { data, error } = await supabase.from('products').select('id, name, sku, selling_price, cost_price').order('name').limit(200);

    const rows = document.getElementById('rows');
    if (error) {
      rows.innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`;
    } else {
      rows.innerHTML = (data || []).map(p => `
        <tr>
          <td>${p.sku || '—'}</td>
          <td><strong>${p.name || '—'}</strong></td>
          <td>GH₵ ${Number(p.selling_price || 0).toLocaleString('en-GH', { minimumFractionDigits: 2 })}</td>
          <td data-perm="product.view_purchase_price" data-cost>${showCost ? 'GH₵ ' + Number(p.cost_price || 0).toLocaleString('en-GH', { minimumFractionDigits: 2 }) : '••••'}</td>
          <td data-perm="product.edit"><button type="button" class="btn" style="background:#f1f5f9;font-size:12px">Edit</button></td>
        </tr>`).join('') || '<tr><td colspan="5" class="muted">No products</td></tr>';
      applyDomPermissions(rows);
    }

    document.getElementById('btnAdd').onclick = () => {
      if (!can('product.add')) return alert('Denied');
      location.href = '/products.html#add';
    };
  </script>
</body>
</html>
