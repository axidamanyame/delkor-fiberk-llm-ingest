<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loyalty Cards</title>
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .page{color:var(--ult-text)}.page h1{margin:0;font-size:22px}
    .sub{margin:0 0 14px}
    .card{background:var(--ult-card);border:1px solid var(--ult-border);border-radius:12px;padding:16px}
    .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .add{background:#4f46e5;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none}
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { supabase } from './js/supabaseClient.js';
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { bindTable } from './js/home-tables.js';
  import { SCOPE_EVENT, filterBySidebar, scopeCaption, inferRowScope, findLocation } from './js/scope.js';
  import { subsidiaryLabel } from './js/entity-scope.js';
  import { loadRows } from './js/ls-rows.js';
  import { KEYS as CAT_KEYS, SEED_LOYALTY, SEED_CUSTOMERS } from './js/catalog-seed.js';
  await mountUltimateShell();
  const app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function load() {
    const [cards, custs] = await Promise.all([
      loadRows('loyalty_cards', CAT_KEYS.loyalty, SEED_LOYALTY).then((d) => ({ data: d })),
      loadRows('customers', CAT_KEYS.customers, SEED_CUSTOMERS).then((d) => ({ data: d })),
    ]);
    let tableRows = filterBySidebar(cards.data || []);
    const byCardCust = new Set(tableRows.map((r) => r.customer_id).filter(Boolean));
    const fromCust = filterBySidebar(custs.data || [])
      .filter((c) => (c.loyalty_card || Number(c.loyalty_points) > 0) && !byCardCust.has(c.id))
      .map((c) => ({
        id: c.id,
        card_no: c.loyalty_card || '',
        customer_id: c.id,
        customer_name: c.name,
        points: c.loyalty_points || 0,
        subsidiary_code: c.subsidiary_code,
        location_code: c.location_code,
        is_active: true,
        _from_customer: true,
      }));
    let rows = tableRows.concat(fromCust);
    const byId = Object.fromEntries((custs.data || []).map((c) => [c.id, c]));
    rows = rows.map((r) => {
      const scoped = inferRowScope(r, r.subsidiary_code || 'bnpl');
      const loc = findLocation(scoped.location_code || r.location_code);
      return {
        ...r,
        customer_name: r.customer_name || byId[r.customer_id]?.name || '',
        subsidiary_code: scoped.subsidiary_code || r.subsidiary_code,
        location_code: scoped.location_code || r.location_code,
        location_name: loc?.name || r.location_name || scoped.location_code || '',
      };
    });
    app.innerHTML = `
      <h1>Loyalty Cards</h1>
      <p class="sub">${esc(scopeCaption())}</p>
      <div class="card" data-tbl="loyal">
        <div class="head"><h2>All cards</h2><a class="add" href="/loyalty-card-edit.html">+ Add</a></div>
        <div class="bar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <label>Show <select data-tbl-size><option>25</option><option>50</option><option>100</option><option>All</option></select> entries</label>
          <div style="flex:1"></div>
          <button type="button" data-exp="csv">Export CSV</button>
          <button type="button" data-exp="xls">Export Excel</button>
          <button type="button" data-exp="print">Print</button>
          <button type="button" data-exp="cols">Column visibility</button>
          <button type="button" data-exp="pdf">Export PDF</button>
          <input data-tbl-search placeholder="Search …" />
        </div>
        ${cards.error ? `<p>${esc(cards.error.message)}</p>` : ''}
        <div class="ult-table-wrap"><table class="ult-table">
          <thead><tr><th>Card No</th><th>Customer</th><th>Points</th><th>Subsidiary</th><th>Location</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td>${esc(r.card_no)}</td>
            <td>${esc(r.customer_name)}</td>
            <td>${esc(r.points ?? 0)}</td>
            <td>${esc(subsidiaryLabel(r.subsidiary_code))}</td>
            <td>${esc(r.location_name || r.location_code || '')}</td>
            <td>${r.is_active === false ? 'Inactive' : 'Active'}</td>
            <td>${r._from_customer
              ? `<a href="/loyalty-card-edit.html?customer=${r.customer_id}">Edit</a>`
              : `<a href="/loyalty-card-edit.html?id=${r.id}">Edit</a>`}
                ${r.customer_id ? ` · <a href="/contact-ledger.html?kind=customer&id=${r.customer_id}">Ledger</a>` : ''}</td>
          </tr>`).join('') || '<tr data-dummy="1"><td colspan="7" style="text-align:center">No data available in table</td></tr>'}</tbody>
        </table></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px"><div data-tbl-info></div><div class="pager" data-tbl-pager></div></div>
      </div>`;
    bindTable(app.querySelector('[data-tbl="loyal"]'), { title: 'Loyalty Cards', storageKey: 'loyalty' });
  }
  window.addEventListener(SCOPE_EVENT, load);
  load();
</script>
</body>
</html>
