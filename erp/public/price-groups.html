<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Selling Price Group</title>
  <link rel="stylesheet" href="/css/ultimate-pos.css" />
  <style>
    .page{color:var(--ult-text)} h1{margin:0;font-size:22px} .sub{color:#3d4f66;font-size:14px;font-weight:400}
    .card{background:var(--ult-card);border:1px solid var(--ult-border);border-radius:12px;padding:16px}
    .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .add{background:#4f46e5;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
    .bar .grow{flex:1}
    .bar select,.bar input,.bar button{border:1px solid #111;background:var(--ult-card);border-radius:8px;padding:5px 10px;font-size:12px}
    table.ult-table th,table.ult-table td{color:var(--ult-text)}
    .pill{border-radius:999px;padding:4px 10px;font-size:12px;text-decoration:none;border:1px solid;margin-right:6px;cursor:pointer;background:var(--ult-card)}
    .edit{color:#6d28d9;border-color:#c4b5fd}
    .del{color:#e11d48;border-color:#fda4af}
    .col-vis-menu,.pdf-orient{position:absolute;top:28px;background:#fff;border:1px solid #111;border-radius:8px;padding:8px;z-index:40}
    .pager button{border:1px solid #111;background:var(--ult-card);padding:4px 10px}
    .pager button.on{background:#1d4ed8;color:#fff}
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
</head>
<body>
<main class="ult-main page" id="app">Loading…</main>
<script type="module">
  import { mountUltimateShell } from './js/ultimate-shell.js';
  import { confirmAction, ackResult } from './js/confirm-action.js';
  import { SCOPE_EVENT, scopeCaption } from './js/scope.js';
  import { bindTable } from './js/home-tables.js';
  import { loadRows, deleteRow, saveRow, uid, esc } from './js/ls-rows.js';
  import { openDeskModal } from './js/desk-modal.js';
  await mountUltimateShell();
  const app = document.getElementById('app');
  const SEED = [
    { id: 'spg-retail', name: 'Retail', description: 'Walk-in till price (Ghana list price)' },
    { id: 'spg-wholesale', name: 'Wholesale', description: '−12% distributor price' },
    { id: 'spg-vip', name: 'VIP', description: '−8% corporate price' },
    { id: 'spg-staff', name: 'Staff', description: '−20% employee purchase' },
  ];
  async function load() {
    const rows = await loadRows('selling_price_groups', 'df_price_groups', SEED);
    app.innerHTML = `
      <h1>Selling Price Group <span class="sub">All Selling Price Group</span></h1>
      <p>${esc(scopeCaption())} · Assign groups to shops under Settings → Location Price Groups.</p>
      <div class="card" data-tbl="t">
        <div class="head"><h2>All Selling Price Group</h2><button type="button" class="add" id="add-spg">+ Add</button></div>
        <div class="bar">
          <label>Show <select data-tbl-size><option selected>25</option><option>50</option><option>100</option><option>All</option></select> entries</label>
          <div class="grow"></div>
          <button type="button" data-exp="csv">Export CSV</button>
          <button type="button" data-exp="xls">Export Excel</button>
          <button type="button" data-exp="print">Print</button>
          <button type="button" data-exp="cols">Column visibility</button>
          <button type="button" data-exp="pdf">Export PDF</button>
          <input data-tbl-search placeholder="Search …" />
        </div>
        <div class="ult-table-wrap"><table class="ult-table">
          <thead><tr><th>Name</th><th>Description</th><th>Action</th></tr></thead>
          <tbody>${rows.map((r) => {
            const on = r.active !== false;
            return `<tr><td>${esc(r.name)}</td><td>${esc(r.description || '')}</td><td>
            <button type="button" class="pill edit" data-edit="${r.id}">Edit</button>
            <button type="button" class="pill del" data-del="${r.id}">Delete</button>
            <button type="button" class="pill ${on ? 'del' : 'edit'}" data-toggle="${r.id}">${on ? 'Deactivate' : 'Activate'}</button>
            </td></tr>`;
          }).join('') || '<tr data-dummy="1"><td colspan="3" style="text-align:center">No data available in table</td></tr>'}</tbody>
        </table></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px"><div data-tbl-info></div><div class="pager" data-tbl-pager></div></div>
      </div>`;
    bindTable(app.querySelector('[data-tbl="t"]'), { title: 'Selling Price Group', storageKey: 'spg' });
    function spgForm(row, isNew) {
      openDeskModal({
        title: isNew ? 'Add Selling Price Group' : 'Edit Selling Price Group',
        saveLabel: isNew ? 'Save' : 'Update',
        body: `<label>Name:*</label><input name="name" required value="${esc(row.name || '')}" />
          <label>Description:</label><input name="description" value="${esc(row.description || '')}" />`,
        onSave: async (fd) => {
          const next = {
            ...row,
            id: row.id || uid(),
            name: String(fd.get('name') || '').trim(),
            description: String(fd.get('description') || '').trim(),
            active: row.active !== false,
          };
          if (!next.name) return false;
          await saveRow('selling_price_groups', 'df_price_groups', next);
          ackResult(true, isNew ? 'Group added.' : 'Group updated.');
          load();
        },
      });
    }
    document.getElementById('add-spg')?.addEventListener('click', () => spgForm({ active: true }, true));
    app.querySelectorAll('[data-edit]').forEach((b) => {
      b.onclick = () => spgForm(rows.find((r) => String(r.id) === String(b.dataset.edit)) || { id: b.dataset.edit }, false);
    });
    app.querySelectorAll('[data-toggle]').forEach((b) => {
      b.onclick = async () => {
        const row = rows.find((r) => String(r.id) === String(b.dataset.toggle));
        if (!row) return;
        await saveRow('selling_price_groups', 'df_price_groups', { ...row, active: row.active === false });
        load();
      };
    });
    app.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!(await confirmAction('Delete this group?', 'This cannot be undone.'))) return;
        await deleteRow('selling_price_groups', 'df_price_groups', b.dataset.del);
        load();
      };
    });
  }
  window.addEventListener(SCOPE_EVENT, load);
  load();
</script>
</body>
</html>
